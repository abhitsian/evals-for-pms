<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b6cf6"/>
    </marker>
  </defs>
  <rect width="760" height="440" fill="#ffffff"/>
  <text x="30" y="32" font-size="18" font-weight="700" fill="#23272f">Three numbers at every step</text>
  <text x="30" y="54" font-size="13" fill="#6b7280">Only traces that passed the prior step flow forward. Pass rate is per-step, not vs. the original total.</text>

  <!-- column legend -->
  <g font-size="12" font-weight="700">
    <rect x="30" y="72" width="150" height="24" rx="6" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.2"/>
    <text x="105" y="89" fill="#1e40af" text-anchor="middle">Entered</text>
    <rect x="196" y="72" width="150" height="24" rx="6" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.2"/>
    <text x="271" y="89" fill="#0f7b54" text-anchor="middle">Passed</text>
    <rect x="362" y="72" width="200" height="24" rx="6" fill="#fff7e0" stroke="#9a6700" stroke-width="1.2"/>
    <text x="462" y="89" fill="#9a6700" text-anchor="middle">Step pass rate = passed ÷ entered</text>
  </g>

  <!-- Step rows as funnel -->
  <g font-size="12.5" fill="#23272f">
    <!-- Step 1 -->
    <rect x="60" y="116" width="500" height="34" rx="8" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.4"/>
    <text x="74" y="138" font-weight="700">Step 1 · Intent</text>
    <text x="300" y="138" text-anchor="middle">entered 100  →  passed 95</text>
    <rect x="572" y="116" width="64" height="34" rx="8" fill="#ffffff" stroke="#e6e8ee"/>
    <text x="604" y="138" text-anchor="middle" font-weight="700" fill="#1e40af">95%</text>

    <line x1="310" y1="150" x2="310" y2="160" stroke="#3b6cf6" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- Step 2 -->
    <rect x="92" y="162" width="436" height="34" rx="8" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.4"/>
    <text x="106" y="184" font-weight="700">Step 2 · Tables</text>
    <text x="310" y="184" text-anchor="middle">entered 95  →  passed 87</text>
    <rect x="572" y="162" width="64" height="34" rx="8" fill="#ffffff" stroke="#e6e8ee"/>
    <text x="604" y="184" text-anchor="middle" font-weight="700" fill="#1e40af">91%</text>

    <line x1="310" y1="196" x2="310" y2="206" stroke="#3b6cf6" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- Step 3 bottleneck -->
    <rect x="150" y="208" width="320" height="38" rx="8" fill="#fff7e0" stroke="#9a6700" stroke-width="2"/>
    <text x="164" y="232" font-weight="700" fill="#9a6700">Step 3 · Columns</text>
    <text x="310" y="232" text-anchor="middle" fill="#9a6700">entered 87  →  passed 66</text>
    <rect x="572" y="208" width="64" height="38" rx="8" fill="#fff7e0" stroke="#9a6700" stroke-width="2"/>
    <text x="604" y="232" text-anchor="middle" font-weight="700" fill="#9a6700">76%</text>
    <text x="648" y="232" font-size="12" fill="#9a6700" font-weight="700">◄ bottleneck</text>

    <line x1="310" y1="246" x2="310" y2="256" stroke="#3b6cf6" stroke-width="1.5" marker-end="url(#arr)"/>

    <!-- Step 4 -->
    <rect x="190" y="258" width="240" height="34" rx="8" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.4"/>
    <text x="204" y="280" font-weight="700" fill="#0f7b54">Step 4 · JOIN</text>
    <text x="310" y="280" text-anchor="middle">66 → 63</text>
    <rect x="572" y="258" width="64" height="34" rx="8" fill="#ffffff" stroke="#e6e8ee"/>
    <text x="604" y="280" text-anchor="middle" font-weight="700" fill="#0f7b54">95%</text>
  </g>

  <!-- key callout -->
  <rect x="30" y="312" width="700" height="104" rx="12" fill="#fff7e0" stroke="#9a6700" stroke-width="1.5"/>
  <text x="48" y="340" font-size="14" font-weight="700" fill="#9a6700">The most-misread mechanic</text>
  <text x="48" y="364" font-size="13" fill="#23272f">Step 4's 95% is computed on the <tspan font-weight="700">66 traces that reached it</tspan> — not on the original 100.</text>
  <text x="48" y="386" font-size="13" fill="#23272f">Late steps look "healthy" only because they never see the traces that already died upstream.</text>
  <text x="48" y="408" font-size="13" fill="#23272f">Step-level pass rate measures a step's intrinsic quality, independent of upstream failures.</text>
</svg>
