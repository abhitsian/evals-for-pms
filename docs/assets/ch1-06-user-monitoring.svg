<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" width="100%" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b6cf6"/>
    </marker>
  </defs>

  <text x="30" y="36" font-size="18" font-weight="700" fill="#23272f">User monitoring — catching the unknown unknowns</text>
  <text x="30" y="58" font-size="13" fill="#6b7280">The only stage that reveals what you didn't anticipate. The loop feeds new cases back to keep offline evals honest.</text>

  <!-- Production sessions -->
  <rect x="30" y="96" width="150" height="92" rx="11" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="105" y="126" font-size="14" font-weight="700" fill="#1e40af" text-anchor="middle">Live sessions</text>
  <text x="105" y="150" font-size="12" fill="#23272f" text-anchor="middle">real users in</text>
  <text x="105" y="167" font-size="12" fill="#23272f" text-anchor="middle">production</text>

  <line x1="180" y1="142" x2="214" y2="142" stroke="#3b6cf6" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Sample -->
  <rect x="218" y="96" width="150" height="92" rx="11" fill="#ffffff" stroke="#e6e8ee" stroke-width="1.5"/>
  <text x="293" y="126" font-size="14" font-weight="700" fill="#23272f" text-anchor="middle">Sample</text>
  <text x="293" y="150" font-size="13" fill="#23272f" text-anchor="middle">1–10% of</text>
  <text x="293" y="167" font-size="13" fill="#23272f" text-anchor="middle">sessions</text>

  <line x1="368" y1="142" x2="402" y2="142" stroke="#3b6cf6" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Evaluator -->
  <rect x="406" y="96" width="170" height="92" rx="11" fill="#ffffff" stroke="#e6e8ee" stroke-width="1.5"/>
  <text x="491" y="126" font-size="14" font-weight="700" fill="#23272f" text-anchor="middle">Evaluator pass</text>
  <text x="491" y="150" font-size="12" fill="#23272f" text-anchor="middle">"Is this tag</text>
  <text x="491" y="167" font-size="12" fill="#23272f" text-anchor="middle">correct?"</text>

  <line x1="576" y1="142" x2="610" y2="142" stroke="#3b6cf6" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Online score -->
  <rect x="614" y="96" width="116" height="92" rx="11" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.5"/>
  <text x="672" y="126" font-size="13" font-weight="700" fill="#0f7b54" text-anchor="middle">Online</text>
  <text x="672" y="144" font-size="13" font-weight="700" fill="#0f7b54" text-anchor="middle">score</text>
  <text x="672" y="167" font-size="11" fill="#6b7280" text-anchor="middle">vs. offline</text>

  <!-- Watch for three signals -->
  <text x="30" y="232" font-size="14" font-weight="700" fill="#23272f">Watch for three signals</text>
  <rect x="30" y="244" width="226" height="70" rx="11" fill="#fff7e0" stroke="#9a6700" stroke-width="1.5"/>
  <text x="143" y="272" font-size="13" font-weight="700" fill="#9a6700" text-anchor="middle">New failure modes</text>
  <text x="143" y="294" font-size="11.5" fill="#23272f" text-anchor="middle">issue types you missed</text>

  <rect x="267" y="244" width="226" height="70" rx="11" fill="#fff7e0" stroke="#9a6700" stroke-width="1.5"/>
  <text x="380" y="272" font-size="13" font-weight="700" fill="#9a6700" text-anchor="middle">Behavior shifts</text>
  <text x="380" y="294" font-size="11.5" fill="#23272f" text-anchor="middle">how users actually talk</text>

  <rect x="504" y="244" width="226" height="70" rx="11" fill="#fff7e0" stroke="#9a6700" stroke-width="1.5"/>
  <text x="617" y="272" font-size="13" font-weight="700" fill="#9a6700" text-anchor="middle">Variant differences</text>
  <text x="617" y="294" font-size="11.5" fill="#23272f" text-anchor="middle">A/B test deltas</text>

  <!-- Drift + feedback loop -->
  <rect x="30" y="344" width="700" height="84" rx="11" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="50" y="372" font-size="14" font-weight="700" fill="#1e40af">Drift = online score − offline score</text>
  <text x="50" y="396" font-size="12.5" fill="#23272f">When the gap widens, your offline set no longer represents reality. Feed the newly</text>
  <text x="50" y="416" font-size="12.5" fill="#23272f">discovered failures back into the reference dataset — each becomes a permanent regression test.</text>

  <!-- loop-back arrow -->
  <path d="M30 386 C 8 386 8 142 24 142" fill="none" stroke="#3b6cf6" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
</svg>
