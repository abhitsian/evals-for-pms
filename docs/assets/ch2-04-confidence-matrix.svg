<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="100%" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif">
  <defs>
    <marker id="ax" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="540" fill="#ffffff"/>
  <text x="32" y="36" font-size="18" font-weight="700" fill="#23272f">Confidence vs. failure-cost matrix</text>
  <text x="32" y="58" font-size="13" fill="#6b7280">Where a PM places the "I don't know" behavior — a product decision, not a model default.</text>

  <!-- Plot area -->
  <!-- origin at (140,420), grid spans x 140-660, y 100-420 -->
  <!-- Quadrant fills -->
  <rect x="140" y="100" width="260" height="160" rx="10" fill="#fff7e0"/>            <!-- top-left -->
  <rect x="400" y="100" width="260" height="160" rx="10" fill="#e7f6ef"/>            <!-- top-right -->
  <rect x="140" y="260" width="260" height="160" rx="10" fill="#ffffff"/>            <!-- bottom-left -->
  <rect x="400" y="260" width="260" height="160" rx="10" fill="#eaf0ff"/>            <!-- bottom-right -->

  <!-- Outer frame + midlines -->
  <rect x="140" y="100" width="520" height="320" rx="10" fill="none" stroke="#e6e8ee" stroke-width="1.5"/>
  <line x1="400" y1="100" x2="400" y2="420" stroke="#e6e8ee" stroke-width="1.5"/>
  <line x1="140" y1="260" x2="660" y2="260" stroke="#e6e8ee" stroke-width="1.5"/>

  <!-- Axes -->
  <line x1="140" y1="420" x2="675" y2="420" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ax)"/>
  <line x1="140" y1="420" x2="140" y2="92" stroke="#6b7280" stroke-width="1.5" marker-end="url(#ax)"/>

  <!-- Axis labels -->
  <text x="400" y="452" font-size="14" font-weight="700" fill="#23272f" text-anchor="middle">Failure cost</text>
  <text x="270" y="472" font-size="12" fill="#6b7280" text-anchor="middle">low (research, brainstorming)</text>
  <text x="530" y="472" font-size="12" fill="#6b7280" text-anchor="middle">high (legal, medical, financial)</text>

  <text x="64" y="260" font-size="14" font-weight="700" fill="#23272f" text-anchor="middle" transform="rotate(-90 64 260)">Confidence threshold</text>
  <text x="104" y="185" font-size="11" fill="#6b7280" text-anchor="middle" transform="rotate(-90 104 185)">high / strict</text>
  <text x="104" y="345" font-size="11" fill="#6b7280" text-anchor="middle" transform="rotate(-90 104 345)">low / loose</text>

  <!-- Top-right: CONSERVATIVE (the recommended quadrant) -->
  <rect x="416" y="116" width="228" height="128" rx="10" fill="#ffffff" stroke="#0f7b54" stroke-width="1.5"/>
  <text x="432" y="140" font-size="15" font-weight="700" fill="#0f7b54">Conservative</text>
  <text x="432" y="162" font-size="12.5" fill="#23272f">Admit uncertainty early.</text>
  <text x="432" y="182" font-size="11.5" fill="#6b7280">Decline when info isn't retrieved,</text>
  <text x="432" y="198" font-size="11.5" fill="#6b7280">sources conflict, or evidence is</text>
  <text x="432" y="214" font-size="11.5" fill="#6b7280">ambiguous.</text>
  <text x="432" y="234" font-size="11.5" font-weight="700" fill="#0f7b54">"I don't know" = success state</text>

  <!-- Bottom-left: PERMISSIVE -->
  <rect x="156" y="276" width="228" height="128" rx="10" fill="#ffffff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="172" y="300" font-size="15" font-weight="700" fill="#1e40af">Permissive</text>
  <text x="172" y="322" font-size="12.5" fill="#23272f">Synthesize and caveat.</text>
  <text x="172" y="342" font-size="11.5" fill="#6b7280">Exploratory work where hedging</text>
  <text x="172" y="358" font-size="11.5" fill="#6b7280">on every suggestion makes the</text>
  <text x="172" y="374" font-size="11.5" fill="#6b7280">tool useless.</text>
  <text x="172" y="394" font-size="11.5" font-weight="700" fill="#1e40af">Offer ideas, flag the caveat</text>

  <!-- Off-quadrant cautions -->
  <text x="270" y="180" font-size="11.5" fill="#9a6700" text-anchor="middle">strict + low cost →</text>
  <text x="270" y="196" font-size="11.5" fill="#9a6700" text-anchor="middle">over-cautious, low value</text>

  <text x="530" y="340" font-size="11.5" fill="#9a6700" text-anchor="middle">loose + high cost →</text>
  <text x="530" y="356" font-size="11.5" fill="#9a6700" text-anchor="middle">fabrication risk</text>

  <!-- "I don't know" rate bands legend -->
  <text x="32" y="500" font-size="13" font-weight="700" fill="#23272f">Measure the "I don't know" rate in production:</text>
  <g font-size="12">
    <rect x="32" y="510" width="14" height="14" rx="3" fill="#9a6700"/>
    <text x="54" y="521" fill="#23272f">&gt;30% → retrieval failing, users hit dead ends</text>
    <rect x="372" y="510" width="14" height="14" rx="3" fill="#0f7b54"/>
    <text x="394" y="521" fill="#23272f">10–20% → healthy enterprise target</text>
    <rect x="372" y="528" width="14" height="14" rx="3" fill="#3b6cf6" opacity="0"/>
  </g>
  <g font-size="12">
    <rect x="32" y="528" width="14" height="14" rx="3" fill="#3b6cf6"/>
    <text x="54" y="539" fill="#23272f">&lt;5% (bounded system) → filling gaps with fabrications</text>
  </g>
</svg>
