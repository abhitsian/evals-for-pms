<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="100%" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3b6cf6"/>
    </marker>
  </defs>

  <text x="380" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#23272f">Where trace analysis sits</text>
  <text x="380" y="62" text-anchor="middle" font-size="13" fill="#6b7280">The bridge from abstract quality goals to concrete insight — the AI equivalent of UX research</text>

  <!-- Left: abstract quality goals -->
  <rect x="30" y="110" width="190" height="150" rx="12" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="125" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">Abstract quality goals</text>
  <text x="125" y="170" text-anchor="middle" font-size="13" fill="#23272f">"Be helpful"</text>
  <text x="125" y="192" text-anchor="middle" font-size="13" fill="#23272f">"Sound on-brand"</text>
  <text x="125" y="214" text-anchor="middle" font-size="13" fill="#23272f">"Don't hallucinate"</text>
  <text x="125" y="240" text-anchor="middle" font-size="12" fill="#6b7280">vague, unmeasurable</text>

  <!-- Middle: trace analysis -->
  <rect x="285" y="100" width="190" height="170" rx="12" fill="#e7f6ef" stroke="#0f7b54" stroke-width="2"/>
  <text x="380" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#0f7b54">Trace analysis</text>
  <text x="380" y="160" text-anchor="middle" font-size="12" fill="#23272f">Read real inputs &amp; outputs</text>
  <text x="380" y="182" text-anchor="middle" font-size="12" fill="#23272f">Name failure modes</text>
  <text x="380" y="204" text-anchor="middle" font-size="12" fill="#23272f">Create reference examples</text>
  <text x="380" y="226" text-anchor="middle" font-size="12" fill="#23272f">Cluster into trace codes</text>
  <text x="380" y="252" text-anchor="middle" font-size="12" font-style="italic" fill="#0f7b54">observe first, judge later</text>

  <!-- Right: concrete insight -->
  <rect x="540" y="110" width="190" height="150" rx="12" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="635" y="140" text-anchor="middle" font-size="15" font-weight="700" fill="#1e40af">Concrete insight</text>
  <text x="635" y="170" text-anchor="middle" font-size="13" fill="#23272f">Binary trace codes</text>
  <text x="635" y="192" text-anchor="middle" font-size="13" fill="#23272f">Rubrics &amp; datasets</text>
  <text x="635" y="214" text-anchor="middle" font-size="13" fill="#23272f">Trusted automation</text>
  <text x="635" y="240" text-anchor="middle" font-size="12" fill="#6b7280">grounded, repeatable</text>

  <line x1="222" y1="185" x2="281" y2="185" stroke="#3b6cf6" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="477" y1="185" x2="536" y2="185" stroke="#3b6cf6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- skip warning -->
  <path d="M285 300 q 175 60 175 0" fill="none" stroke="#9a6700" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)" transform="translate(0,-10)"/>
  <rect x="170" y="330" width="420" height="60" rx="10" fill="#fff7e0" stroke="#9a6700" stroke-width="1.5"/>
  <text x="380" y="356" text-anchor="middle" font-size="13" font-weight="700" fill="#9a6700">The step teams skip on the way to dashboards</text>
  <text x="380" y="378" text-anchor="middle" font-size="12" fill="#9a6700">Skip it and your metrics look credible but don't match reality</text>

  <path d="M180 300 C 320 270, 440 270, 580 300" fill="none" stroke="#9a6700" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="380" y="288" text-anchor="middle" font-size="11" font-style="italic" fill="#9a6700">tempting shortcut →</text>
</svg>
