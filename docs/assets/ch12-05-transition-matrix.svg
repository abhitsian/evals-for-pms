<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif">
  <rect width="760" height="440" fill="#ffffff"/>
  <text x="30" y="32" font-size="18" font-weight="700" fill="#23272f">Transition failure matrix</text>
  <text x="30" y="54" font-size="13" fill="#6b7280">Last successful step (rows) × first failing step (columns). Cells count failing traces.</text>

  <!-- axis labels -->
  <text x="380" y="84" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">First FAILING step →</text>
  <text x="42" y="240" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle" transform="rotate(-90 42 240)">Last SUCCESSFUL step →</text>

  <!-- column headers -->
  <g font-size="11.5" font-weight="700" fill="#23272f" text-anchor="middle">
    <text x="200" y="108">Tables</text>
    <text x="280" y="108">Columns</text>
    <text x="360" y="108">JOIN</text>
    <text x="440" y="108">WHERE</text>
    <text x="520" y="108">GenSQL</text>
    <text x="600" y="108">ExecSQL</text>
  </g>
  <!-- row headers -->
  <g font-size="11.5" font-weight="700" fill="#23272f" text-anchor="end">
    <text x="150" y="138">Intent</text>
    <text x="150" y="178">Tables</text>
    <text x="150" y="218">Columns</text>
    <text x="150" y="258">JOIN</text>
    <text x="150" y="298">WHERE</text>
    <text x="150" y="338">GenSQL</text>
  </g>

  <!-- grid cells: 6 cols x 6 rows, each 80 wide x 40 high, start x=160 y=118 -->
  <g font-size="13" text-anchor="middle">
    <!-- helper: low cells light, hot cell amber -->
    <!-- Row Intent (y118) -->
    <rect x="160" y="118" width="80" height="40" fill="#eaf0ff" stroke="#e6e8ee"/><text x="200" y="143" fill="#6b7280">5</text>
    <rect x="240" y="118" width="80" height="40" fill="#ffffff" stroke="#e6e8ee"/><text x="280" y="143" fill="#6b7280">0</text>
    <rect x="320" y="118" width="80" height="40" fill="#ffffff" stroke="#e6e8ee"/><text x="360" y="143" fill="#6b7280">0</text>
    <rect x="400" y="118" width="80" height="40" fill="#ffffff" stroke="#e6e8ee"/><text x="440" y="143" fill="#6b7280">0</text>
    <rect x="480" y="118" width="80" height="40" fill="#ffffff" stroke="#e6e8ee"/><text x="520" y="143" fill="#6b7280">0</text>
    <rect x="560" y="118" width="80" height="40" fill="#ffffff" stroke="#e6e8ee"/><text x="600" y="143" fill="#6b7280">0</text>
    <!-- Row Tables (y158) -->
    <rect x="160" y="158" width="80" height="40" fill="#ffffff" stroke="#e6e8ee"/><text x="200" y="183" fill="#6b7280">—</text>
    <rect x="240" y="158" width="80" height="40" fill="#fdeec2" stroke="#9a6700"/><text x="280" y="183" fill="#9a6700" font-weight="700">8</text>
    <rect x="320" y="158" width="80" height="40" fill="#ffffff" stroke="#e6e8ee"/><text x="360" y="183" fill="#6b7280">0</text>
    <rect x="400" y="158" width="80" height="40" fill="#ffffff" stroke="#e6e8ee"/><text x="440" y="183" fill="#6b7280">0</text>
    <rect x="480" y="158" width="80" height="40" fill="#ffffff" stroke="#e6e8ee"/><text x="520" y="183" fill="#6b7280">0</text>
    <rect x="560" y="158" width="80" height="40" fill="#ffffff" stroke="#e6e8ee"/><text x="600" y="183" fill="#6b7280">0</text>
    <!-- Row Columns (y198) -->
    <rect x="160" y="198" width="80" height="40" fill="#ffffff" stroke="#e6e8ee"/><text x="200" y="223" fill="#6b7280">—</text>
    <rect x="240" y="198" width="80" height="40" fill="#ffffff" stroke="#e6e8ee"/><text x="280" y="223" fill="#6b7280">—</text>
    <rect x="320" y="198" width="80" height="40" fill="#fdeec2" stroke="#9a6700"/><text x="360" y="223" fill="#9a6700" font-weight="700">3</text>
    <rect x="400" y="198" width="80" height="40" fill="#ffffff" stroke="#e6e8ee"/><text x="440" y="223" fill="#6b7280">0</text>
    <rect x="480" y="198" width="80" height="40" fill="#ffffff" stroke="#e6e8ee"/><text x="520" y="223" fill="#6b7280">0</text>
    <rect x="560" y="198" width="80" height="40" fill="#ffffff" stroke="#e6e8ee"/><text x="600" y="223" fill="#6b7280">0</text>
    <!-- Row JOIN (y238) -->
    <rect x="160" y="238" width="80" height="40" fill="#ffffff" stroke="#e6e8ee"/><text x="200" y="263" fill="#6b7280">—</text>
    <rect x="240" y="238" width="80" height="40" fill="#ffffff" stroke="#e6e8ee"/><text x="280" y="263" fill="#6b7280">—</text>
    <rect x="320" y="238" width="80" height="40" fill="#ffffff" stroke="#e6e8ee"/><text x="360" y="263" fill="#6b7280">—</text>
    <rect x="400" y="238" width="80" height="40" fill="#eaf0ff" stroke="#e6e8ee"/><text x="440" y="263" fill="#6b7280">3</text>
    <rect x="480" y="238" width="80" height="40" fill="#ffffff" stroke="#e6e8ee"/><text x="520" y="263" fill="#6b7280">0</text>
    <rect x="560" y="238" width="80" height="40" fill="#ffffff" stroke="#e6e8ee"/><text x="600" y="263" fill="#6b7280">0</text>
    <!-- Row WHERE (y278) -->
    <rect x="160" y="278" width="80" height="40" fill="#ffffff" stroke="#e6e8ee"/><text x="200" y="303" fill="#6b7280">—</text>
    <rect x="240" y="278" width="80" height="40" fill="#ffffff" stroke="#e6e8ee"/><text x="280" y="303" fill="#6b7280">—</text>
    <rect x="320" y="278" width="80" height="40" fill="#ffffff" stroke="#e6e8ee"/><text x="360" y="303" fill="#6b7280">—</text>
    <rect x="400" y="278" width="80" height="40" fill="#ffffff" stroke="#e6e8ee"/><text x="440" y="303" fill="#6b7280">—</text>
    <rect x="480" y="278" width="80" height="40" fill="#eaf0ff" stroke="#e6e8ee"/><text x="520" y="303" fill="#6b7280">2</text>
    <rect x="560" y="278" width="80" height="40" fill="#ffffff" stroke="#e6e8ee"/><text x="600" y="303" fill="#6b7280">0</text>
    <!-- Row GenSQL (y318) HOT CELL ExecSQL -->
    <rect x="160" y="318" width="80" height="40" fill="#ffffff" stroke="#e6e8ee"/><text x="200" y="343" fill="#6b7280">—</text>
    <rect x="240" y="318" width="80" height="40" fill="#ffffff" stroke="#e6e8ee"/><text x="280" y="343" fill="#6b7280">—</text>
    <rect x="320" y="318" width="80" height="40" fill="#ffffff" stroke="#e6e8ee"/><text x="360" y="343" fill="#6b7280">—</text>
    <rect x="400" y="318" width="80" height="40" fill="#ffffff" stroke="#e6e8ee"/><text x="440" y="343" fill="#6b7280">—</text>
    <rect x="480" y="318" width="80" height="40" fill="#ffffff" stroke="#e6e8ee"/><text x="520" y="343" fill="#6b7280">—</text>
    <rect x="560" y="318" width="80" height="40" fill="#9a6700" stroke="#7a5200" stroke-width="2"/><text x="600" y="343" fill="#ffffff" font-weight="700" font-size="15">12</text>
  </g>

  <!-- callout to hot cell -->
  <rect x="30" y="376" width="700" height="50" rx="12" fill="#fff7e0" stroke="#9a6700" stroke-width="1.5"/>
  <text x="48" y="397" font-size="13" fill="#23272f"><tspan font-weight="700" fill="#9a6700">GenSQL → ExecSQL = 12 failures</tspan> vs. ≤8 elsewhere: SQL that looks correct but fails on execution.</text>
  <text x="48" y="416" font-size="12.5" fill="#6b7280">The matrix localizes the exact transition producing failures — what the funnel alone can't isolate.</text>
</svg>
