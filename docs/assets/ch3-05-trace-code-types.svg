<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="100%" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif">
  <text x="380" y="38" text-anchor="middle" font-size="18" font-weight="700" fill="#23272f">Three signal types in a trace review</text>
  <text x="380" y="60" text-anchor="middle" font-size="13" fill="#6b7280">A good review captures wins and emergent strengths, not only errors</text>

  <!-- Hard performance failures -->
  <rect x="30" y="90" width="225" height="270" rx="12" fill="#fff7e0" stroke="#9a6700" stroke-width="1.5"/>
  <rect x="30" y="90" width="225" height="44" rx="12" fill="#9a6700"/>
  <text x="142" y="118" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">Hard performance failures</text>
  <text x="142" y="156" text-anchor="middle" font-size="12" font-style="italic" fill="#9a6700">objectively wrong</text>
  <text x="48" y="190" font-size="12.5" fill="#23272f">• Hallucinated facts</text>
  <text x="48" y="218" font-size="12.5" fill="#23272f">• Missed user constraints</text>
  <text x="48" y="246" font-size="12.5" fill="#23272f">• Tool-invocation failures</text>
  <text x="48" y="290" font-size="11.5" fill="#6b7280">Eng-adjacent: a tool failure</text>
  <text x="48" y="308" font-size="11.5" fill="#6b7280">buried in an intermediate span</text>

  <!-- Soft quality issues -->
  <rect x="267" y="90" width="225" height="270" rx="12" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
  <rect x="267" y="90" width="225" height="44" rx="12" fill="#3b6cf6"/>
  <text x="379" y="118" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">Soft quality issues</text>
  <text x="379" y="156" text-anchor="middle" font-size="12" font-style="italic" fill="#1e40af">technically OK, still degrades UX</text>
  <text x="285" y="190" font-size="12.5" fill="#23272f">• Tone feels off</text>
  <text x="285" y="218" font-size="12.5" fill="#23272f">• Correct but unhelpful</text>
  <text x="285" y="246" font-size="12.5" fill="#23272f">• No next-step suggestion</text>
  <text x="285" y="290" font-size="11.5" fill="#6b7280">Design-adjacent: format,</text>
  <text x="285" y="308" font-size="11.5" fill="#6b7280">readability, presentation</text>

  <!-- Product differentiators -->
  <rect x="504" y="90" width="226" height="270" rx="12" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.5"/>
  <rect x="504" y="90" width="226" height="44" rx="12" fill="#0f7b54"/>
  <text x="617" y="118" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">Product differentiators</text>
  <text x="617" y="156" text-anchor="middle" font-size="12" font-style="italic" fill="#0f7b54">play offense — capture wins</text>
  <text x="522" y="190" font-size="12.5" fill="#23272f">• Good clarifying questions</text>
  <text x="522" y="218" font-size="12.5" fill="#23272f">• Uniquely useful format</text>
  <text x="522" y="246" font-size="12.5" fill="#23272f">• Anticipates next question</text>
  <text x="522" y="290" font-size="11.5" fill="#6b7280">Affirmative codes protect</text>
  <text x="522" y="308" font-size="11.5" fill="#6b7280">and amplify product taste</text>
</svg>
