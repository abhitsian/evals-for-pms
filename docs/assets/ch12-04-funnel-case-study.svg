<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif">
  <rect width="760" height="440" fill="#ffffff"/>
  <text x="30" y="32" font-size="18" font-weight="700" fill="#23272f">Text-to-SQL funnel · 100 queries</text>
  <text x="30" y="54" font-size="13" fill="#6b7280">Read the pinch, not the averages. Step 3 is the bottleneck even though every later step is ≥95%.</text>

  <!-- Funnel: centered decreasing bars. Center x=380. Scale: 100 traces = 600px -->
  <!-- bar width = passing*6, label right -->
  <g font-size="12" fill="#23272f">
    <!-- Step 1: 95 -->
    <rect x="95" y="78" width="570" height="30" rx="7" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.4"/>
    <text x="380" y="98" text-anchor="middle" font-weight="700" fill="#1e40af">1 · Intent understanding</text>
    <text x="680" y="98" font-size="12" fill="#6b7280">95/100 · 95%</text>

    <!-- Step 2: 87 -->
    <rect x="119" y="116" width="522" height="30" rx="7" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.4"/>
    <text x="380" y="136" text-anchor="middle" font-weight="700" fill="#1e40af">2 · Table identification</text>
    <text x="680" y="136" font-size="12" fill="#6b7280">87/95 · 91%</text>

    <!-- Step 3: 66 BOTTLENECK -->
    <rect x="182" y="154" width="396" height="36" rx="7" fill="#fff7e0" stroke="#9a6700" stroke-width="2.2"/>
    <text x="380" y="177" text-anchor="middle" font-weight="700" fill="#9a6700">3 · Column selection  ◄ BOTTLENECK</text>
    <text x="680" y="177" font-size="12" font-weight="700" fill="#9a6700">66/87 · 76%</text>

    <!-- Step 4: 63 -->
    <rect x="191" y="198" width="378" height="28" rx="7" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.4"/>
    <text x="380" y="217" text-anchor="middle" font-weight="700" fill="#0f7b54">4 · JOIN logic</text>
    <text x="680" y="217" font-size="12" fill="#6b7280">63/66 · 95%</text>

    <!-- Step 5: 60 -->
    <rect x="200" y="234" width="360" height="28" rx="7" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.4"/>
    <text x="380" y="253" text-anchor="middle" font-weight="700" fill="#0f7b54">5 · WHERE clause</text>
    <text x="680" y="253" font-size="12" fill="#6b7280">60/63 · 95%</text>

    <!-- Step 6: 58 -->
    <rect x="206" y="270" width="348" height="28" rx="7" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.4"/>
    <text x="380" y="289" text-anchor="middle" font-weight="700" fill="#0f7b54">6 · Query compilation</text>
    <text x="680" y="289" font-size="12" fill="#6b7280">58/60 · 97%</text>

    <!-- Step 7: 55 -->
    <rect x="215" y="306" width="330" height="28" rx="7" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.4"/>
    <text x="380" y="325" text-anchor="middle" font-weight="700" fill="#0f7b54">7 · Execution success</text>
    <text x="680" y="325" font-size="12" fill="#6b7280">55/58 · 96%</text>
  </g>

  <!-- pinch marker -->
  <text x="60" y="176" font-size="11" fill="#9a6700" font-weight="700" text-anchor="middle">pinch</text>

  <!-- bottom math -->
  <rect x="30" y="350" width="340" height="74" rx="12" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="48" y="376" font-size="14" font-weight="700" fill="#1e40af">End-to-end: 55 / 100</text>
  <text x="48" y="398" font-size="12.5" fill="#23272f">Step 3 alone = 21 of 45 failures (87 − 66).</text>
  <text x="48" y="416" font-size="12.5" fill="#23272f">Late steps cost only 2–3 traces each.</text>

  <rect x="386" y="350" width="344" height="74" rx="12" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.5"/>
  <text x="404" y="376" font-size="14" font-weight="700" fill="#0f7b54">Leverage math</text>
  <text x="404" y="398" font-size="12.5" fill="#23272f">Lift Step 3 76%→95% ⇒ recover ~16 traces.</text>
  <text x="404" y="416" font-size="12.5" fill="#23272f">End-to-end ~70% — a 15-pt gain from one fix.</text>
</svg>
