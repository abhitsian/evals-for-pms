<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" width="100%" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif">
  <text x="30" y="36" font-size="18" font-weight="700" fill="#23272f">Golden outputs — the answer key</text>
  <text x="30" y="58" font-size="13" fill="#6b7280">Each input mapped to its ideal intent / sentiment / urgency. Doubles as few-shot examples and offline reference set.</text>

  <!-- Header row -->
  <rect x="30" y="80" width="700" height="34" rx="8" fill="#1e40af"/>
  <text x="44" y="102" font-size="12.5" font-weight="700" fill="#ffffff">Input ticket</text>
  <text x="430" y="102" font-size="12.5" font-weight="700" fill="#ffffff">Intent</text>
  <text x="560" y="102" font-size="12.5" font-weight="700" fill="#ffffff">Sentiment</text>
  <text x="672" y="102" font-size="12.5" font-weight="700" fill="#ffffff">Urgency</text>

  <!-- Row 1 -->
  <rect x="30" y="118" width="700" height="40" rx="6" fill="#ffffff" stroke="#e6e8ee" stroke-width="1"/>
  <text x="44" y="142" font-size="12" fill="#23272f">"Charged twice this month, no one is responding"</text>
  <text x="430" y="142" font-size="11.5" fill="#9a6700">Billing</text>
  <text x="560" y="142" font-size="11.5" fill="#b42318">Angry</text>
  <text x="672" y="142" font-size="11.5" font-weight="700" fill="#9a6700">High</text>

  <!-- Row 2 -->
  <rect x="30" y="162" width="700" height="40" rx="6" fill="#f7f9fc" stroke="#e6e8ee" stroke-width="1"/>
  <text x="44" y="186" font-size="12" fill="#23272f">"Would love a dark mode option"</text>
  <text x="430" y="186" font-size="11.5" fill="#3b6cf6">Feature Request</text>
  <text x="560" y="186" font-size="11.5" fill="#0f7b54">Positive</text>
  <text x="672" y="186" font-size="11.5" fill="#6b7280">Low</text>

  <!-- Row 3 -->
  <rect x="30" y="206" width="700" height="40" rx="6" fill="#ffffff" stroke="#e6e8ee" stroke-width="1"/>
  <text x="44" y="230" font-size="12" fill="#23272f">"502 error every time I export a report, started this morning"</text>
  <text x="430" y="230" font-size="11.5" fill="#1e40af">Technical</text>
  <text x="560" y="230" font-size="11.5" fill="#9a6700">Frustrated</text>
  <text x="672" y="230" font-size="11.5" font-weight="700" fill="#9a6700">High</text>

  <!-- Row 4 -->
  <rect x="30" y="250" width="700" height="40" rx="6" fill="#f7f9fc" stroke="#e6e8ee" stroke-width="1"/>
  <text x="44" y="274" font-size="12" fill="#23272f">"How do I update my billing address?"</text>
  <text x="430" y="274" font-size="11.5" fill="#9a6700">Billing</text>
  <text x="560" y="274" font-size="11.5" fill="#6b7280">Neutral</text>
  <text x="672" y="274" font-size="11.5" fill="#6b7280">Low</text>

  <!-- Row 5 -->
  <rect x="30" y="294" width="700" height="40" rx="6" fill="#ffffff" stroke="#e6e8ee" stroke-width="1"/>
  <text x="44" y="318" font-size="12" fill="#23272f">"App is completely broken and I'm about to cancel if this isn't fixed today"</text>
  <text x="430" y="318" font-size="11.5" fill="#1e40af">Technical</text>
  <text x="560" y="318" font-size="11.5" fill="#b42318">Angry</text>
  <text x="672" y="318" font-size="11.5" font-weight="700" fill="#b42318">Critical</text>

  <!-- Edge cases callout -->
  <rect x="30" y="356" width="700" height="116" rx="11" fill="#fff7e0" stroke="#9a6700" stroke-width="1.5"/>
  <text x="50" y="384" font-size="14" font-weight="700" fill="#9a6700">Don't forget the edge cases</text>
  <text x="50" y="408" font-size="12.5" fill="#23272f">Ambiguous inputs are where agents break — include them deliberately:</text>
  <rect x="50" y="420" width="80" height="26" rx="7" fill="#ffffff" stroke="#9a6700" stroke-width="1"/>
  <text x="90" y="437" font-size="12" fill="#23272f" text-anchor="middle">"Hello"</text>
  <rect x="142" y="420" width="500" height="26" rx="7" fill="#ffffff" stroke="#9a6700" stroke-width="1"/>
  <text x="158" y="437" font-size="12" fill="#23272f">"I hate this app, I want to cancel, but can I get a discount for the Pro plan?"</text>
</svg>
