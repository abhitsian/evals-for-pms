<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif">
  <defs>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3b6cf6"/>
    </marker>
  </defs>

  <text x="30" y="40" font-size="18" font-weight="700" fill="#23272f">Specification gap vs Generalization gap</text>
  <text x="30" y="62" font-size="13" fill="#6b7280">Two different failure modes — only one earns an automated eval</text>

  <!-- Specification gap card -->
  <rect x="30" y="86" width="340" height="312" rx="12" fill="#fff7e0" stroke="#9a6700" stroke-width="1.5"/>
  <text x="50" y="118" font-size="16" font-weight="700" fill="#9a6700">Specification gap</text>
  <text x="50" y="140" font-size="13" fill="#23272f">Incomplete instructions</text>

  <rect x="50" y="156" width="300" height="68" rx="10" fill="#ffffff" stroke="#e6e8ee" stroke-width="1.5"/>
  <text x="66" y="180" font-size="12.5" fill="#6b7280">SYMPTOM</text>
  <text x="66" y="201" font-size="13.5" fill="#23272f">Fails because the prompt never</text>
  <text x="66" y="217" font-size="13.5" fill="#23272f">mentioned the requirement</text>

  <rect x="50" y="236" width="300" height="62" rx="10" fill="#ffffff" stroke="#e6e8ee" stroke-width="1.5"/>
  <text x="66" y="260" font-size="12.5" fill="#6b7280">EXAMPLE</text>
  <text x="66" y="282" font-size="13.5" fill="#23272f">Email drafter never adds a subject</text>

  <rect x="50" y="310" width="300" height="62" rx="10" fill="#ffffff" stroke="#9a6700" stroke-width="1.5"/>
  <text x="66" y="334" font-size="12.5" fill="#6b7280">FIX</text>
  <text x="66" y="356" font-size="14.5" font-weight="700" fill="#9a6700">Update the system prompt</text>

  <!-- Generalization gap card -->
  <rect x="390" y="86" width="340" height="312" rx="12" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.5"/>
  <text x="410" y="118" font-size="16" font-weight="700" fill="#0f7b54">Generalization gap</text>
  <text x="410" y="140" font-size="13" fill="#23272f">Inconsistent behavior despite clear instructions</text>

  <rect x="410" y="156" width="300" height="68" rx="10" fill="#ffffff" stroke="#e6e8ee" stroke-width="1.5"/>
  <text x="426" y="180" font-size="12.5" fill="#6b7280">SYMPTOM</text>
  <text x="426" y="201" font-size="13.5" fill="#23272f">Works on the ideal test set, but</text>
  <text x="426" y="217" font-size="13.5" fill="#23272f">dips on a diverse real dataset</text>

  <rect x="410" y="236" width="300" height="62" rx="10" fill="#ffffff" stroke="#e6e8ee" stroke-width="1.5"/>
  <text x="426" y="260" font-size="12.5" fill="#6b7280">EXAMPLE</text>
  <text x="426" y="282" font-size="13.5" fill="#23272f">Personalizes only on recent threads</text>

  <rect x="410" y="310" width="300" height="62" rx="10" fill="#ffffff" stroke="#0f7b54" stroke-width="1.5"/>
  <text x="426" y="334" font-size="12.5" fill="#6b7280">FIX</text>
  <text x="426" y="356" font-size="14.5" font-weight="700" fill="#0f7b54">Build an automated eval</text>

  <line x1="362" y1="188" x2="408" y2="188" stroke="#3b6cf6" stroke-width="2" marker-end="url(#arrowA)" stroke-dasharray="5 4"/>

  <text x="50" y="420" font-size="12" fill="#6b7280">Cheapest fix — no measurement needed</text>
  <text x="410" y="420" font-size="12" fill="#0f7b54" font-weight="600">The only good automation candidate</text>
</svg>
