<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b6cf6"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="30" y="34" font-size="18" font-weight="700" fill="#23272f">Black box vs. decomposition</text>
  <text x="30" y="56" font-size="13" fill="#6b7280">One headline number hides the bottleneck. Decomposition shows the knob to turn.</text>

  <!-- divider -->
  <line x1="380" y1="78" x2="380" y2="412" stroke="#e6e8ee" stroke-width="1.5"/>

  <!-- LEFT: black box -->
  <text x="30" y="98" font-size="14" font-weight="700" fill="#6b7280">BLACK BOX</text>

  <rect x="60" y="150" width="44" height="44" rx="10" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="82" y="178" font-size="13" fill="#1e40af" text-anchor="middle">in</text>
  <line x1="108" y1="172" x2="146" y2="172" stroke="#3b6cf6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="150" y="118" width="120" height="108" rx="12" fill="#23272f" stroke="#23272f" stroke-width="1.5"/>
  <text x="210" y="166" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Agent</text>
  <text x="210" y="186" font-size="12" fill="#6b7280" text-anchor="middle">(opaque)</text>

  <line x1="270" y1="172" x2="308" y2="172" stroke="#3b6cf6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="312" y="150" width="44" height="44" rx="10" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="334" y="178" font-size="13" fill="#1e40af" text-anchor="middle">out</text>

  <!-- headline rate -->
  <rect x="120" y="260" width="180" height="70" rx="12" fill="#fff7e0" stroke="#9a6700" stroke-width="1.5"/>
  <text x="210" y="296" font-size="30" font-weight="700" fill="#9a6700" text-anchor="middle">55%</text>
  <text x="210" y="318" font-size="12" fill="#9a6700" text-anchor="middle">end-to-end success</text>

  <text x="120" y="372" font-size="13" fill="#23272f">"Fails 45% of the time."</text>
  <text x="120" y="392" font-size="13" fill="#6b7280">Not a roadmap — nowhere to look.</text>

  <!-- RIGHT: decomposition -->
  <text x="410" y="98" font-size="14" font-weight="700" fill="#0f7b54">DECOMPOSITION</text>

  <!-- component chain -->
  <!-- Routing -->
  <rect x="410" y="120" width="150" height="48" rx="10" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.5"/>
  <text x="424" y="142" font-size="13" font-weight="700" fill="#23272f">Routing</text>
  <text x="424" y="160" font-size="12" fill="#0f7b54">95% correct</text>

  <line x1="560" y1="144" x2="598" y2="144" stroke="#3b6cf6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="600" y="120" width="130" height="48" rx="10" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.5"/>
  <text x="614" y="142" font-size="13" font-weight="700" fill="#23272f">Skill A</text>
  <text x="614" y="160" font-size="12" fill="#0f7b54">95%</text>

  <!-- SQL gen - bottleneck -->
  <rect x="410" y="200" width="150" height="48" rx="10" fill="#fff7e0" stroke="#9a6700" stroke-width="1.5"/>
  <text x="424" y="222" font-size="13" font-weight="700" fill="#23272f">SQL generation</text>
  <text x="424" y="240" font-size="12" font-weight="700" fill="#9a6700">76% ← bottleneck</text>

  <line x1="560" y1="224" x2="598" y2="224" stroke="#3b6cf6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="600" y="200" width="130" height="48" rx="10" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.5"/>
  <text x="614" y="222" font-size="13" font-weight="700" fill="#23272f">Summary</text>
  <text x="614" y="240" font-size="12" fill="#0f7b54">95%</text>

  <!-- multiplication -->
  <rect x="410" y="282" width="320" height="56" rx="12" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="430" y="307" font-size="14" fill="#23272f">0.95 × 0.95 × 0.76 × 0.95 =</text>
  <text x="675" y="309" font-size="18" font-weight="700" fill="#1e40af" text-anchor="middle">~62%</text>

  <text x="410" y="372" font-size="13" fill="#23272f">"Fix SQL generation."</text>
  <text x="410" y="392" font-size="13" fill="#6b7280">A prioritized backlog — one knob to turn.</text>
</svg>
