<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif">
  <text x="32" y="38" font-size="18" font-weight="700" fill="#23272f">Each size threshold buys a capability</text>
  <text x="32" y="60" font-size="13" fill="#6b7280">Size isn't volume — and quality beats quantity at every step.</text>

  <!-- axis -->
  <line x1="100" y1="320" x2="700" y2="320" stroke="#e6e8ee" stroke-width="2"/>
  <text x="100" y="342" font-size="11.5" fill="#6b7280" text-anchor="middle">0</text>

  <!-- step bars (rising) -->
  <!-- 30-50 -->
  <rect x="120" y="240" width="150" height="80" rx="10" fill="#fff7e0" stroke="#9a6700" stroke-width="1.5"/>
  <text x="195" y="232" font-size="15" font-weight="700" fill="#9a6700" text-anchor="middle">30–50</text>
  <text x="195" y="266" font-size="12.5" font-weight="700" fill="#23272f" text-anchor="middle">Seed set</text>
  <text x="195" y="286" font-size="11" fill="#6b7280" text-anchor="middle">happy path +</text>
  <text x="195" y="300" font-size="11" fill="#6b7280" text-anchor="middle">known failures</text>

  <!-- 100+ -->
  <rect x="295" y="170" width="150" height="150" rx="10" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="370" y="162" font-size="15" font-weight="700" fill="#1e40af" text-anchor="middle">100+</text>
  <text x="370" y="200" font-size="12.5" font-weight="700" fill="#23272f" text-anchor="middle">Stable pass rates</text>
  <text x="370" y="222" font-size="11" fill="#6b7280" text-anchor="middle">below 50, one trace</text>
  <text x="370" y="236" font-size="11" fill="#6b7280" text-anchor="middle">flipping swings the</text>
  <text x="370" y="250" font-size="11" fill="#6b7280" text-anchor="middle">rate 2+ points</text>

  <!-- 200+ -->
  <rect x="470" y="100" width="150" height="220" rx="10" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.5"/>
  <text x="545" y="92" font-size="15" font-weight="700" fill="#0f7b54" text-anchor="middle">200+</text>
  <text x="545" y="130" font-size="12.5" font-weight="700" fill="#23272f" text-anchor="middle">Reliable</text>
  <text x="545" y="148" font-size="12.5" font-weight="700" fill="#23272f" text-anchor="middle">calibration</text>
  <text x="545" y="174" font-size="11" fill="#6b7280" text-anchor="middle">splits into</text>
  <text x="545" y="188" font-size="11" fill="#6b7280" text-anchor="middle">train/dev/test</text>
  <text x="545" y="208" font-size="11" fill="#6b7280" text-anchor="middle">and still gives valid</text>
  <text x="545" y="222" font-size="11" fill="#6b7280" text-anchor="middle">TPR/TNR per bucket</text>

  <!-- quality note -->
  <rect x="120" y="356" width="500" height="44" rx="10" fill="#ffffff" stroke="#23272f" stroke-width="1.5"/>
  <text x="370" y="383" font-size="13" font-weight="700" fill="#23272f" text-anchor="middle">50 diverse, well-labeled examples beat 500 that oversample easy cases.</text>
</svg>
