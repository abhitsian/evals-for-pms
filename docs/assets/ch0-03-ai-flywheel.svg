<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" width="100%" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3b6cf6"/>
    </marker>
  </defs>

  <!-- card -->
  <rect x="6" y="6" width="748" height="468" rx="12" fill="#ffffff" stroke="#e6e8ee" stroke-width="1.5"/>

  <!-- title -->
  <text x="380" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#23272f">The AI Flywheel — a closed, compounding loop</text>
  <text x="380" y="62" text-anchor="middle" font-size="13" fill="#6b7280">each turn sharpens the next; quality is engineered, not hoped for</text>

  <!-- circular guide arrows between nodes -->
  <!-- center ~ (380, 270), radius ~150 -->
  <!-- We place 5 nodes around the circle, clockwise, with curved arrows -->

  <!-- curved arrows (drawn first so nodes sit on top) -->
  <path d="M455,150 A160,160 0 0 1 540,290" fill="none" stroke="#3b6cf6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M520,360 A160,160 0 0 1 400,427" fill="none" stroke="#3b6cf6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M320,420 A160,160 0 0 1 226,338" fill="none" stroke="#3b6cf6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M222,255 A160,160 0 0 1 300,156" fill="none" stroke="#3b6cf6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- back to start -->
  <path d="M340,138 A160,160 0 0 1 420,138" fill="none" stroke="#3b6cf6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Node 1: Agent Success Rate (top) -->
  <g>
    <rect x="278" y="92" width="204" height="56" rx="12" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.5"/>
    <text x="380" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#0f7b54">⭐ 1 · Agent Success Rate</text>
    <text x="380" y="135" text-anchor="middle" font-size="11" fill="#6b7280">the new north-star metric</text>
  </g>

  <!-- Node 2: Trace Analysis (right) -->
  <g>
    <rect x="538" y="232" width="190" height="56" rx="12" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
    <text x="633" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">🔍 2 · Trace Analysis</text>
    <text x="633" y="275" text-anchor="middle" font-size="11" fill="#6b7280">the new source of truth</text>
  </g>

  <!-- Node 3: Reference Datasets (bottom-right) -->
  <g>
    <rect x="430" y="392" width="200" height="56" rx="12" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
    <text x="530" y="416" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">🎙 3 · Reference Datasets</text>
    <text x="530" y="435" text-anchor="middle" font-size="11" fill="#6b7280">golden outputs + edge cases</text>
  </g>

  <!-- Node 4: Offline Evaluation (bottom-left) -->
  <g>
    <rect x="130" y="392" width="200" height="56" rx="12" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
    <text x="230" y="416" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">📐 4 · Offline Evaluation</text>
    <text x="230" y="435" text-anchor="middle" font-size="11" fill="#6b7280">unit tests for agents</text>
  </g>

  <!-- Node 5: Online Monitoring (left) -->
  <g>
    <rect x="32" y="232" width="200" height="56" rx="12" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
    <text x="132" y="256" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">⏺ 5 · Online Monitoring</text>
    <text x="132" y="275" text-anchor="middle" font-size="11" fill="#6b7280">logging the live signals</text>
  </g>

  <!-- center hub -->
  <circle cx="380" cy="270" r="62" fill="#fff7e0" stroke="#9a6700" stroke-width="1.5"/>
  <text x="380" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#9a6700">AI</text>
  <text x="380" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#9a6700">Flywheel</text>
  <text x="380" y="300" text-anchor="middle" font-size="10" fill="#6b7280">compounds quality</text>

  <!-- closing-the-loop note -->
  <text x="132" y="306" text-anchor="middle" font-size="10" fill="#0f7b54">feeds back → step 1</text>
</svg>
