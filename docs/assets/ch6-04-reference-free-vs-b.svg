<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif">
  <rect width="760" height="440" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="700" fill="#23272f">Reference-free vs reference-based</text>
  <text x="40" y="62" font-size="13" fill="#6b7280">Your available evidence decides which judge you can build today</text>

  <!-- Reference-free card -->
  <rect x="40" y="84" width="330" height="300" rx="12" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.5"/>
  <text x="60" y="116" font-size="16" font-weight="700" fill="#0f7b54">Reference-free</text>
  <rect x="252" y="98" width="100" height="24" rx="12" fill="#0f7b54"/>
  <text x="302" y="115" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">BUILD FIRST</text>

  <text x="60" y="148" font-size="12" font-weight="700" fill="#6b7280">COMPARES AGAINST</text>
  <text x="60" y="168" font-size="13" fill="#23272f">Nothing — the output on its own merits</text>

  <text x="60" y="200" font-size="12" font-weight="700" fill="#6b7280">MEASURES</text>
  <text x="60" y="220" font-size="13" fill="#23272f">Directness, tone, presence of a next</text>
  <text x="60" y="238" font-size="13" fill="#23272f">step, unsupported claims</text>

  <text x="60" y="270" font-size="12" font-weight="700" fill="#6b7280">NEEDS TO BUILD</text>
  <text x="60" y="290" font-size="13" fill="#23272f">Any representative traces</text>

  <rect x="56" y="312" width="298" height="56" rx="8" fill="#ffffff" stroke="#0f7b54" stroke-width="1.5"/>
  <text x="70" y="334" font-size="12" font-weight="700" fill="#0f7b54">PM takeaway</text>
  <text x="70" y="354" font-size="12" fill="#23272f">Use these to bootstrap your dataset.</text>

  <!-- Reference-based card -->
  <rect x="390" y="84" width="330" height="300" rx="12" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="410" y="116" font-size="16" font-weight="700" fill="#1e40af">Reference-based</text>
  <rect x="582" y="98" width="120" height="24" rx="12" fill="#3b6cf6"/>
  <text x="642" y="115" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">ADD WHEN READY</text>

  <text x="410" y="148" font-size="12" font-weight="700" fill="#6b7280">COMPARES AGAINST</text>
  <text x="410" y="168" font-size="13" fill="#23272f">A reference: query, ground-truth</text>
  <text x="410" y="186" font-size="13" fill="#23272f">answer, or retrieved context</text>

  <text x="410" y="216" font-size="12" font-weight="700" fill="#6b7280">MEASURES</text>
  <text x="410" y="236" font-size="13" fill="#23272f">Factual accuracy, grounding, correct</text>
  <text x="410" y="254" font-size="13" fill="#23272f">category labels</text>

  <text x="410" y="284" font-size="12" font-weight="700" fill="#6b7280">NEEDS TO BUILD</text>
  <text x="410" y="304" font-size="13" fill="#23272f">Reliable ground truth or context</text>

  <rect x="406" y="320" width="298" height="48" rx="8" fill="#ffffff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="420" y="340" font-size="12" font-weight="700" fill="#1e40af">PM takeaway</text>
  <text x="420" y="358" font-size="12" fill="#23272f">Add once you have reliable ground truth.</text>
</svg>
