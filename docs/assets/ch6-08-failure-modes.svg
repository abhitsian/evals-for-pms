<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif">
  <rect width="760" height="440" fill="#ffffff"/>
  <text x="40" y="40" font-size="18" font-weight="700" fill="#23272f">How calibrated judges break</text>
  <text x="40" y="62" font-size="13" fill="#6b7280">Predictable failure modes — knowing them in advance lets you design around them</text>

  <!-- Row 1 -->
  <rect x="40" y="86" width="220" height="140" rx="12" fill="#ffffff" stroke="#b3236a" stroke-width="1.5"/>
  <rect x="40" y="86" width="220" height="30" rx="12" fill="#b3236a"/>
  <rect x="40" y="100" width="220" height="16" fill="#b3236a"/>
  <text x="56" y="106" font-size="13.5" font-weight="700" fill="#ffffff">1 · Gaming</text>
  <text x="56" y="142" font-size="12" fill="#23272f">Output learns to satisfy the</text>
  <text x="56" y="160" font-size="12" fill="#23272f">judge without satisfying users.</text>
  <text x="56" y="196" font-size="11" fill="#b3236a" font-style="italic">Judge up, CSAT flat —</text>
  <text x="56" y="212" font-size="11" fill="#b3236a" font-style="italic">users edit out the preamble.</text>

  <rect x="270" y="86" width="220" height="140" rx="12" fill="#ffffff" stroke="#b3236a" stroke-width="1.5"/>
  <rect x="270" y="86" width="220" height="30" rx="12" fill="#b3236a"/>
  <rect x="270" y="100" width="220" height="16" fill="#b3236a"/>
  <text x="286" y="106" font-size="13.5" font-weight="700" fill="#ffffff">2 · Distribution drift</text>
  <text x="286" y="142" font-size="12" fill="#23272f">Calibrated on one distribution,</text>
  <text x="286" y="160" font-size="12" fill="#23272f">applied to a new one.</text>
  <text x="286" y="196" font-size="11" fill="#b3236a" font-style="italic">B2C billing examples don't</text>
  <text x="286" y="212" font-size="11" fill="#b3236a" font-style="italic">hold for developer accounts.</text>

  <rect x="500" y="86" width="220" height="140" rx="12" fill="#ffffff" stroke="#b3236a" stroke-width="1.5"/>
  <rect x="500" y="86" width="220" height="30" rx="12" fill="#b3236a"/>
  <rect x="500" y="100" width="220" height="16" fill="#b3236a"/>
  <text x="516" y="106" font-size="13.5" font-weight="700" fill="#ffffff">3 · Novel outputs</text>
  <text x="516" y="142" font-size="12" fill="#23272f">No stable definition of "good"</text>
  <text x="516" y="160" font-size="12" fill="#23272f">for a brand-new feature.</text>
  <text x="516" y="196" font-size="11" fill="#b3236a" font-style="italic">Judge defaults to rewarding</text>
  <text x="516" y="212" font-size="11" fill="#b3236a" font-style="italic">fluency and polish.</text>

  <!-- Row 2 -->
  <rect x="155" y="244" width="220" height="140" rx="12" fill="#ffffff" stroke="#b3236a" stroke-width="1.5"/>
  <rect x="155" y="244" width="220" height="30" rx="12" fill="#b3236a"/>
  <rect x="155" y="258" width="220" height="16" fill="#b3236a"/>
  <text x="171" y="264" font-size="13.5" font-weight="700" fill="#ffffff">4 · Deep-domain misses</text>
  <text x="171" y="300" font-size="12" fill="#23272f">Judge lacks the expertise to</text>
  <text x="171" y="318" font-size="12" fill="#23272f">spot a subtle domain error.</text>
  <text x="171" y="354" font-size="11" fill="#b3236a" font-style="italic">Looks correct, isn't —</text>
  <text x="171" y="370" font-size="11" fill="#b3236a" font-style="italic">needs an expert reference.</text>

  <rect x="385" y="244" width="220" height="140" rx="12" fill="#ffffff" stroke="#b3236a" stroke-width="1.5"/>
  <rect x="385" y="244" width="220" height="30" rx="12" fill="#b3236a"/>
  <rect x="385" y="258" width="220" height="16" fill="#b3236a"/>
  <text x="401" y="264" font-size="13.5" font-weight="700" fill="#ffffff">5 · Style over substance</text>
  <text x="401" y="300" font-size="12" fill="#23272f">Rewards verbose answers that</text>
  <text x="401" y="318" font-size="12" fill="#23272f">"look actionable."</text>
  <text x="401" y="354" font-size="11" fill="#b3236a" font-style="italic">Timelines &amp; escalation paths,</text>
  <text x="401" y="370" font-size="11" fill="#b3236a" font-style="italic">but dodges the question.</text>
</svg>
