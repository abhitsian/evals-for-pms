<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3b6cf6"/>
    </marker>
  </defs>

  <!-- card -->
  <rect x="6" y="6" width="748" height="428" rx="12" fill="#ffffff" stroke="#e6e8ee" stroke-width="1.5"/>

  <!-- title -->
  <text x="380" y="40" text-anchor="middle" font-size="18" font-weight="700" fill="#23272f">From Funnel to Distribution</text>
  <text x="380" y="62" text-anchor="middle" font-size="13" fill="#6b7280">AI products don't funnel — they spread</text>

  <!-- divider -->
  <line x1="380" y1="84" x2="380" y2="392" stroke="#e6e8ee" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- ===== LEFT: traditional funnel / Sankey ===== -->
  <text x="190" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">Traditional product</text>
  <text x="190" y="122" text-anchor="middle" font-size="12" fill="#6b7280">single happy path</text>

  <!-- funnel stages -->
  <rect x="70" y="142" width="240" height="40" rx="10" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="190" y="167" text-anchor="middle" font-size="13" fill="#23272f">Visit</text>

  <rect x="100" y="206" width="180" height="40" rx="10" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="190" y="231" text-anchor="middle" font-size="13" fill="#23272f">Sign up</text>

  <rect x="130" y="270" width="120" height="40" rx="10" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="190" y="295" text-anchor="middle" font-size="13" fill="#23272f">Convert</text>

  <!-- funnel connectors -->
  <line x1="190" y1="182" x2="190" y2="204" stroke="#3b6cf6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="190" y1="246" x2="190" y2="268" stroke="#3b6cf6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="135" y="334" width="110" height="34" rx="10" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.5"/>
  <text x="190" y="356" text-anchor="middle" font-size="12" font-weight="700" fill="#0f7b54">Done ✓</text>
  <line x1="190" y1="310" x2="190" y2="332" stroke="#3b6cf6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="190" y="388" text-anchor="middle" font-size="12" fill="#6b7280">one completion event</text>

  <!-- ===== RIGHT: distribution of outcomes ===== -->
  <text x="570" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af">AI-native product</text>
  <text x="570" y="122" text-anchor="middle" font-size="12" fill="#6b7280">a spread of personalized outcomes</text>

  <!-- axis -->
  <line x1="440" y1="330" x2="700" y2="330" stroke="#23272f" stroke-width="1.5"/>
  <line x1="440" y1="330" x2="440" y2="150" stroke="#23272f" stroke-width="1.5"/>
  <text x="700" y="350" text-anchor="end" font-size="11" fill="#6b7280">output quality →</text>
  <text x="432" y="160" text-anchor="end" font-size="11" fill="#6b7280" transform="rotate(-90 432 160)"># of sessions</text>

  <!-- bell curve area -->
  <path d="M440,330 C500,330 505,180 570,178 C635,180 640,330 700,330 Z"
        fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>

  <!-- bad tail highlighted (amber) -->
  <path d="M440,330 C470,330 478,262 498,250 L498,330 Z" fill="#fff7e0" stroke="#9a6700" stroke-width="1.5"/>

  <!-- unknown zone (grey) -->
  <rect x="520" y="178" width="100" height="152" fill="#6b7280" opacity="0.10"/>

  <!-- labels under curve -->
  <text x="468" y="392" text-anchor="middle" font-size="11" fill="#9a6700">bad tail</text>
  <text x="570" y="392" text-anchor="middle" font-size="11" fill="#6b7280">grey "unknown"</text>
  <text x="675" y="392" text-anchor="middle" font-size="11" fill="#0f7b54">great</text>

  <!-- shift arrow -->
  <text x="570" y="148" text-anchor="middle" font-size="11" fill="#3b6cf6">shift the whole curve right →</text>
</svg>
