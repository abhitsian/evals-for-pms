<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="100%" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif">
  <rect width="760" height="420" fill="#ffffff"/>
  <text x="40" y="46" font-size="18" font-weight="700" fill="#23272f">Check — category presence</text>
  <text x="40" y="70" font-size="13" fill="#6b7280">Exactly one canonical label. Under 10 lines, runs in microseconds.</text>

  <!-- code block -->
  <rect x="40" y="92" width="430" height="280" rx="12" fill="#0b1020"/>
  <text x="62" y="124" font-size="13" fill="#7aa2ff" font-family="ui-monospace, Menlo, monospace">def check_category(trace):</text>
  <text x="62" y="148" font-size="13" fill="#e6e8ee" font-family="ui-monospace, Menlo, monospace">  labels = {"Technical", "Billing",</text>
  <text x="62" y="170" font-size="13" fill="#e6e8ee" font-family="ui-monospace, Menlo, monospace">            "Feature Request"}</text>
  <text x="62" y="192" font-size="13" fill="#e6e8ee" font-family="ui-monospace, Menlo, monospace">  found = [l for l in labels</text>
  <text x="62" y="214" font-size="13" fill="#e6e8ee" font-family="ui-monospace, Menlo, monospace">           if l in trace.output]</text>
  <text x="62" y="240" font-size="13" fill="#e6e8ee" font-family="ui-monospace, Menlo, monospace">  if len(found) == 1:</text>
  <text x="62" y="262" font-size="13" fill="#8ee6b6" font-family="ui-monospace, Menlo, monospace">    return True, f"label={found[0]}"</text>
  <text x="62" y="288" font-size="13" fill="#e6e8ee" font-family="ui-monospace, Menlo, monospace">  return False, (</text>
  <text x="62" y="310" font-size="13" fill="#ff9bbf" font-family="ui-monospace, Menlo, monospace">    "No single valid category label")</text>

  <!-- outcomes -->
  <rect x="498" y="120" width="222" height="100" rx="12" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.5"/>
  <text x="520" y="150" font-size="14" font-weight="700" fill="#0f7b54">PASS</text>
  <text x="520" y="176" font-size="13" fill="#23272f" font-family="ui-monospace, Menlo, monospace">"Category: Billing"</text>
  <text x="520" y="200" font-size="12" fill="#6b7280">exactly one label found</text>

  <rect x="498" y="244" width="222" height="110" rx="12" fill="#fff7e0" stroke="#9a6700" stroke-width="1.5"/>
  <text x="520" y="274" font-size="14" font-weight="700" fill="#b3236a">FAIL</text>
  <text x="520" y="300" font-size="13" fill="#23272f" font-family="ui-monospace, Menlo, monospace">"billing-related"</text>
  <text x="520" y="324" font-size="12" fill="#6b7280">zero canonical labels —</text>
  <text x="520" y="342" font-size="12" fill="#6b7280">paraphrase, not a label</text>

  <text x="40" y="402" font-size="12" fill="#6b7280">Structure / presence check on the Support Triage response.</text>
</svg>
