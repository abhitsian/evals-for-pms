<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b6cf6"/>
    </marker>
  </defs>
  <text x="32" y="38" font-size="18" font-weight="700" fill="#23272f">Label the criterion, not the trace</text>
  <text x="32" y="60" font-size="13" fill="#6b7280">A single good/bad verdict throws away the diagnostic value.</text>

  <!-- the trace -->
  <rect x="60" y="160" width="190" height="120" rx="12" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="155" y="195" font-size="16" font-weight="700" fill="#1e40af" text-anchor="middle">Trace #42</text>
  <text x="155" y="222" font-size="11.5" fill="#6b7280" text-anchor="middle">one input + one</text>
  <text x="155" y="238" font-size="11.5" fill="#6b7280" text-anchor="middle">agent response...</text>
  <text x="155" y="262" font-size="11.5" font-weight="700" fill="#23272f" text-anchor="middle">...three verdicts</text>

  <!-- arrows to three criteria -->
  <line x1="250" y1="190" x2="338" y2="135" stroke="#3b6cf6" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="250" y1="220" x2="338" y2="220" stroke="#3b6cf6" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="250" y1="250" x2="338" y2="305" stroke="#3b6cf6" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- empathy: pass -->
  <rect x="344" y="108" width="360" height="54" rx="10" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.5"/>
  <circle cx="372" cy="135" r="13" fill="#0f7b54"/>
  <text x="372" y="140" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">✓</text>
  <text x="398" y="130" font-size="14" font-weight="700" fill="#23272f">Empathetic acknowledgement</text>
  <text x="398" y="150" font-size="11.5" fill="#0f7b54">PASS → judge for "empathy" criterion</text>

  <!-- actionability: fail -->
  <rect x="344" y="193" width="360" height="54" rx="10" fill="#fff7e0" stroke="#9a6700" stroke-width="1.5"/>
  <circle cx="372" cy="220" r="13" fill="#9a6700"/>
  <text x="372" y="225" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">✕</text>
  <text x="398" y="215" font-size="14" font-weight="700" fill="#23272f">Actionability</text>
  <text x="398" y="235" font-size="11.5" fill="#9a6700">FAIL → judge for "actionability" criterion</text>

  <!-- grounding: pass -->
  <rect x="344" y="278" width="360" height="54" rx="10" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.5"/>
  <circle cx="372" cy="305" r="13" fill="#0f7b54"/>
  <text x="372" y="310" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">✓</text>
  <text x="398" y="300" font-size="14" font-weight="700" fill="#23272f">Factual grounding</text>
  <text x="398" y="320" font-size="11.5" fill="#0f7b54">PASS → judge for "grounding" criterion</text>

  <!-- footer caution -->
  <rect x="60" y="360" width="644" height="44" rx="10" fill="#ffffff" stroke="#23272f" stroke-width="1.5"/>
  <text x="382" y="387" font-size="12.5" fill="#23272f" text-anchor="middle">"Rate this response" makes the labeler invent their own rubric. Each label maps to exactly one eval criterion.</text>
</svg>
