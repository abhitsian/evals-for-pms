<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b6cf6"/>
    </marker>
  </defs>

  <text x="380" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#23272f">The Three Levers</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Exhaust the cheap levers before the expensive ones — most early wins are prompt-level</text>

  <!-- Cost/speed axis -->
  <line x1="60" y1="392" x2="700" y2="392" stroke="#e6e8ee" stroke-width="1.5"/>
  <text x="60" y="416" font-size="12" font-weight="600" fill="#0f7b54">Cheap · fast — try first</text>
  <text x="700" y="416" text-anchor="end" font-size="12" font-weight="600" fill="#9a6700">Expensive · slow — last resort</text>
  <line x1="60" y1="392" x2="700" y2="392" stroke="#3b6cf6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Lever 1 -->
  <rect x="40" y="96" width="216" height="266" rx="12" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.5"/>
  <circle cx="68" cy="126" r="14" fill="#0f7b54"/>
  <text x="68" y="131" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">1</text>
  <text x="92" y="124" font-size="16" font-weight="700" fill="#0f7b54">Prompt</text>
  <text x="92" y="142" font-size="16" font-weight="700" fill="#0f7b54">engineering</text>
  <text x="56" y="174" font-size="12" fill="#23272f">• add instructions for</text>
  <text x="68" y="190" font-size="12" fill="#23272f">unaddressed failures</text>
  <text x="56" y="212" font-size="12" fill="#23272f">• add few-shot from the</text>
  <text x="68" y="228" font-size="12" fill="#23272f">golden dataset</text>
  <text x="56" y="250" font-size="12" fill="#23272f">• restructure for clarity</text>
  <text x="56" y="272" font-size="12" fill="#23272f">• add fallback / "I don't</text>
  <text x="68" y="288" font-size="12" fill="#23272f">know" instructions</text>
  <text x="56" y="310" font-size="12" fill="#23272f">• tighten output format</text>
  <text x="56" y="344" font-size="11.5" font-style="italic" fill="#0f7b54">Most early-stage gains live here</text>

  <!-- Lever 2 -->
  <rect x="272" y="96" width="216" height="266" rx="12" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
  <circle cx="300" cy="126" r="14" fill="#3b6cf6"/>
  <text x="300" y="131" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">2</text>
  <text x="324" y="124" font-size="16" font-weight="700" fill="#1e40af">Model</text>
  <text x="324" y="142" font-size="16" font-weight="700" fill="#1e40af">upgrades</text>
  <text x="288" y="174" font-size="12" fill="#23272f">• run full suite on any</text>
  <text x="300" y="190" font-size="12" fill="#23272f">new release at once</text>
  <text x="288" y="212" font-size="12" fill="#23272f">• suite = model-readiness</text>
  <text x="300" y="228" font-size="12" fill="#23272f">test (24–48 hrs)</text>
  <text x="288" y="250" font-size="12" fill="#23272f">• watch split results</text>
  <text x="300" y="266" font-size="12" fill="#23272f">(reasoning up, format down)</text>
  <text x="288" y="288" font-size="12" fill="#23272f">• weigh cost + latency,</text>
  <text x="300" y="304" font-size="12" fill="#23272f">not just quality</text>
  <text x="288" y="344" font-size="11.5" font-style="italic" fill="#1e40af">Better on the dimensions that matter?</text>

  <!-- Lever 3 -->
  <rect x="504" y="96" width="216" height="266" rx="12" fill="#fff7e0" stroke="#9a6700" stroke-width="1.5"/>
  <circle cx="532" cy="126" r="14" fill="#9a6700"/>
  <text x="532" y="131" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">3</text>
  <text x="556" y="124" font-size="16" font-weight="700" fill="#9a6700">Architectural</text>
  <text x="556" y="142" font-size="16" font-weight="700" fill="#9a6700">changes</text>
  <text x="520" y="174" font-size="12" fill="#23272f">• add retrieval (RAG /</text>
  <text x="532" y="190" font-size="12" fill="#23272f">file search)</text>
  <text x="520" y="212" font-size="12" fill="#23272f">• connect a new tool / API</text>
  <text x="520" y="234" font-size="12" fill="#23272f">• split into sub-agents</text>
  <text x="520" y="256" font-size="12" fill="#23272f">• add a pre-processing step</text>
  <text x="520" y="278" font-size="12" fill="#23272f">• change orchestration flow</text>
  <text x="520" y="312" font-size="11.5" fill="#9a6700">Needs evidence the current</text>
  <text x="520" y="328" font-size="11.5" fill="#9a6700">architecture can't solve it.</text>
  <text x="520" y="346" font-size="11.5" font-weight="700" fill="#9a6700">Re-baseline all evals after.</text>
</svg>
