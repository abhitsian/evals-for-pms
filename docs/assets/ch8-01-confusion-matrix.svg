<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif">
  <rect width="760" height="440" fill="#ffffff"/>
  <text x="40" y="38" font-size="18" font-weight="700" fill="#23272f">Confusion Matrix — Empathy Judge (100 traces)</text>
  <text x="40" y="60" font-size="13" fill="#6b7280">Same row totals (70 vs 77) hide an asymmetric failure profile</text>

  <!-- Column header band -->
  <text x="355" y="98" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">JUDGE says</text>
  <rect x="230" y="108" width="180" height="34" rx="10" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="320" y="130" font-size="14" font-weight="700" fill="#1e40af" text-anchor="middle">PASS</text>
  <rect x="420" y="108" width="180" height="34" rx="10" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="510" y="130" font-size="14" font-weight="700" fill="#1e40af" text-anchor="middle">FAIL</text>

  <!-- Row header band -->
  <text x="78" y="240" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle" transform="rotate(-90 78 240)">HUMAN labels</text>
  <rect x="92" y="152" width="128" height="100" rx="10" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="156" y="200" font-size="14" font-weight="700" fill="#1e40af" text-anchor="middle">PASS</text>
  <text x="156" y="220" font-size="12" fill="#6b7280" text-anchor="middle">(70 total)</text>
  <rect x="92" y="262" width="128" height="100" rx="10" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="156" y="310" font-size="14" font-weight="700" fill="#1e40af" text-anchor="middle">FAIL</text>
  <text x="156" y="330" font-size="12" fill="#6b7280" text-anchor="middle">(30 total)</text>

  <!-- Cells -->
  <!-- TP -->
  <rect x="230" y="152" width="180" height="100" rx="12" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.5"/>
  <text x="320" y="186" font-size="13" font-weight="700" fill="#0f7b54" text-anchor="middle">True Positive</text>
  <text x="320" y="220" font-size="30" font-weight="700" fill="#0f7b54" text-anchor="middle">55</text>
  <text x="320" y="240" font-size="12" fill="#6b7280" text-anchor="middle">agree: good</text>
  <!-- FN -->
  <rect x="420" y="152" width="180" height="100" rx="12" fill="#fff7e0" stroke="#9a6700" stroke-width="1.5"/>
  <text x="510" y="186" font-size="13" font-weight="700" fill="#9a6700" text-anchor="middle">False Negative</text>
  <text x="510" y="220" font-size="30" font-weight="700" fill="#9a6700" text-anchor="middle">15</text>
  <text x="510" y="240" font-size="12" fill="#6b7280" text-anchor="middle">rejected good work</text>
  <!-- FP -->
  <rect x="230" y="262" width="180" height="100" rx="12" fill="#fff7e0" stroke="#9a6700" stroke-width="1.5"/>
  <text x="320" y="296" font-size="13" font-weight="700" fill="#9a6700" text-anchor="middle">False Positive</text>
  <text x="320" y="330" font-size="30" font-weight="700" fill="#9a6700" text-anchor="middle">22</text>
  <text x="320" y="350" font-size="12" fill="#6b7280" text-anchor="middle">let bad through ⚠</text>
  <!-- TN -->
  <rect x="420" y="262" width="180" height="100" rx="12" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.5"/>
  <text x="510" y="296" font-size="13" font-weight="700" fill="#0f7b54" text-anchor="middle">True Negative</text>
  <text x="510" y="330" font-size="30" font-weight="700" fill="#0f7b54" text-anchor="middle">8</text>
  <text x="510" y="350" font-size="12" fill="#6b7280" text-anchor="middle">agree: bad</text>

  <!-- Rate panels -->
  <rect x="625" y="152" width="110" height="100" rx="12" fill="#ffffff" stroke="#e6e8ee" stroke-width="1.5"/>
  <text x="680" y="180" font-size="13" font-weight="700" fill="#23272f" text-anchor="middle">TPR</text>
  <text x="680" y="206" font-size="11" fill="#6b7280" text-anchor="middle">55/(55+15)</text>
  <text x="680" y="236" font-size="24" font-weight="700" fill="#0f7b54" text-anchor="middle">79%</text>

  <rect x="625" y="262" width="110" height="100" rx="12" fill="#ffffff" stroke="#e6e8ee" stroke-width="1.5"/>
  <text x="680" y="290" font-size="13" font-weight="700" fill="#23272f" text-anchor="middle">TNR</text>
  <text x="680" y="316" font-size="11" fill="#6b7280" text-anchor="middle">8/(8+22)</text>
  <text x="680" y="346" font-size="24" font-weight="700" fill="#9a6700" text-anchor="middle">27%</text>

  <text x="40" y="402" font-size="13" fill="#23272f">Decent at recognizing good (TPR 79%), nearly useless at catching bad (TNR 27%) —</text>
  <text x="40" y="422" font-size="13" fill="#23272f">an asymmetry invisible in the pass rate, visible only once you build the matrix.</text>
</svg>
