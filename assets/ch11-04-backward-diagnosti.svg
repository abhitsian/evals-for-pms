<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b6cf6"/>
    </marker>
    <marker id="arrowamber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a6700"/>
    </marker>
  </defs>

  <text x="30" y="34" font-size="18" font-weight="700" fill="#23272f">Read the trace backwards</text>
  <text x="30" y="56" font-size="13" fill="#6b7280">Failures light up at Steps 3, 5, 7 — but the origin is Step 1.</text>

  <!-- trace of 7 steps -->
  <!-- step boxes, y row -->
  <!-- Step 1: primary failure (amber) -->
  <rect x="30" y="120" width="86" height="58" rx="10" fill="#fff7e0" stroke="#9a6700" stroke-width="1.5"/>
  <text x="73" y="143" font-size="12" font-weight="700" fill="#23272f" text-anchor="middle">Step 1</text>
  <text x="73" y="162" font-size="11" fill="#9a6700" text-anchor="middle">ROOT CAUSE</text>

  <line x1="116" y1="149" x2="138" y2="149" stroke="#3b6cf6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 2 ok -->
  <rect x="140" y="120" width="74" height="58" rx="10" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.5"/>
  <text x="177" y="143" font-size="12" font-weight="700" fill="#23272f" text-anchor="middle">Step 2</text>
  <text x="177" y="162" font-size="11" fill="#0f7b54" text-anchor="middle">ok*</text>

  <line x1="214" y1="149" x2="236" y2="149" stroke="#3b6cf6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 3 fail (secondary) -->
  <rect x="238" y="120" width="74" height="58" rx="10" fill="#ffffff" stroke="#9a6700" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="275" y="143" font-size="12" font-weight="700" fill="#23272f" text-anchor="middle">Step 3</text>
  <text x="275" y="162" font-size="11" fill="#9a6700" text-anchor="middle">fails</text>

  <line x1="312" y1="149" x2="334" y2="149" stroke="#3b6cf6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 4 ok* -->
  <rect x="336" y="120" width="74" height="58" rx="10" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.5"/>
  <text x="373" y="143" font-size="12" font-weight="700" fill="#23272f" text-anchor="middle">Step 4</text>
  <text x="373" y="162" font-size="11" fill="#0f7b54" text-anchor="middle">ok*</text>

  <line x1="410" y1="149" x2="432" y2="149" stroke="#3b6cf6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 5 fail -->
  <rect x="434" y="120" width="74" height="58" rx="10" fill="#ffffff" stroke="#9a6700" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="471" y="143" font-size="12" font-weight="700" fill="#23272f" text-anchor="middle">Step 5</text>
  <text x="471" y="162" font-size="11" fill="#9a6700" text-anchor="middle">fails</text>

  <line x1="508" y1="149" x2="530" y2="149" stroke="#3b6cf6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 6 ok* -->
  <rect x="532" y="120" width="74" height="58" rx="10" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.5"/>
  <text x="569" y="143" font-size="12" font-weight="700" fill="#23272f" text-anchor="middle">Step 6</text>
  <text x="569" y="162" font-size="11" fill="#0f7b54" text-anchor="middle">ok*</text>

  <line x1="606" y1="149" x2="628" y2="149" stroke="#3b6cf6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Step 7 fail -->
  <rect x="630" y="120" width="74" height="58" rx="10" fill="#ffffff" stroke="#9a6700" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="667" y="143" font-size="12" font-weight="700" fill="#23272f" text-anchor="middle">Step 7</text>
  <text x="667" y="162" font-size="11" fill="#9a6700" text-anchor="middle">fails</text>

  <text x="30" y="198" font-size="11" fill="#6b7280">* "ok" = ran correctly on wrong inputs — silently inherits the upstream error.</text>

  <!-- backward scan arrow -->
  <line x1="667" y1="234" x2="86" y2="234" stroke="#9a6700" stroke-width="2" marker-end="url(#arrowamber)"/>
  <text x="380" y="226" font-size="12" font-weight="700" fill="#9a6700" text-anchor="middle">scan backwards: find the last correct step, inspect the next one</text>

  <!-- pointer to origin -->
  <line x1="73" y1="234" x2="73" y2="182" stroke="#9a6700" stroke-width="1.5"/>

  <!-- count box -->
  <rect x="30" y="266" width="330" height="120" rx="12" fill="#fff7e0" stroke="#9a6700" stroke-width="1.5"/>
  <text x="50" y="294" font-size="14" font-weight="700" fill="#23272f">Count primary, not secondary</text>
  <text x="50" y="320" font-size="13" fill="#23272f">Steps 3, 5, 7 are downstream noise.</text>
  <text x="50" y="342" font-size="13" fill="#23272f">One root cause at Step 1.</text>
  <text x="50" y="370" font-size="15" font-weight="700" fill="#9a6700">= 1 failure, not 3</text>

  <!-- principle box -->
  <rect x="378" y="266" width="352" height="120" rx="12" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="398" y="294" font-size="14" font-weight="700" fill="#1e40af">The trap vs. the discipline</text>
  <text x="398" y="320" font-size="13" fill="#23272f">Trap: fix where the error appears (Step 7).</text>
  <text x="398" y="342" font-size="13" fill="#23272f">Discipline: work back to where it</text>
  <text x="398" y="360" font-size="13" fill="#23272f">originated (Step 1).</text>
  <text x="398" y="380" font-size="12" fill="#6b7280">10 Step-1 failures rippling to Steps 3–7 = 10, not 50.</text>
</svg>
