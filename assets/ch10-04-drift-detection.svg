<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="100%" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#3b6cf6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
  <text x="32" y="40" font-size="18" font-weight="700" fill="#23272f">Drift isn't one thing — diagnose which of the three</text>
  <text x="32" y="62" font-size="13" fill="#6b7280">Each signal routes to a different fix. Conflating them sends teams to the wrong remedy.</text>

  <!-- Mini line chart showing diverging band (score divergence) -->
  <g>
    <line x1="60" y1="100" x2="60" y2="220" stroke="#23272f" stroke-width="1.5"/>
    <line x1="60" y1="220" x2="340" y2="220" stroke="#23272f" stroke-width="1.5"/>
    <text x="200" y="92" font-size="13" font-weight="700" fill="#23272f" text-anchor="middle">Offline vs online over time</text>
    <!-- divergence band -->
    <path d="M70,128 C150,124 230,121 320,118 L320,196 C230,165 150,142 70,134 Z" fill="#fff7e0" opacity="0.85"/>
    <!-- offline flat-high -->
    <path d="M70,128 C150,124 230,121 320,118" fill="none" stroke="#0f7b54" stroke-width="2.5"/>
    <text x="324" y="122" font-size="11" fill="#0f7b54">90%</text>
    <!-- online dropping -->
    <path d="M70,134 C150,142 230,165 320,196" fill="none" stroke="#9a6700" stroke-width="2.5"/>
    <text x="324" y="200" font-size="11" fill="#9a6700">72%</text>
  </g>

  <!-- Signal 1 -->
  <rect x="396" y="92" width="336" height="106" rx="11" fill="#ffffff" stroke="#3b6cf6" stroke-width="1.5"/>
  <circle cx="422" cy="118" r="13" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="422" y="123" font-size="13" font-weight="700" fill="#1e40af" text-anchor="middle">1</text>
  <text x="446" y="116" font-size="14.5" font-weight="700" fill="#23272f">Score divergence</text>
  <text x="446" y="138" font-size="12.5" fill="#6b7280">Offline 90% but online 72% on the same evals.</text>
  <text x="446" y="156" font-size="12.5" fill="#6b7280">Reference set doesn't represent production.</text>
  <text x="412" y="184" font-size="12.5" font-weight="700" fill="#1e40af">Fix: refresh dataset — add production traces, rebalance.</text>

  <!-- Signal 2 -->
  <rect x="396" y="210" width="336" height="106" rx="11" fill="#ffffff" stroke="#0f7b54" stroke-width="1.5"/>
  <circle cx="422" cy="236" r="13" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.5"/>
  <text x="422" y="241" font-size="13" font-weight="700" fill="#0f7b54" text-anchor="middle">2</text>
  <text x="446" y="234" font-size="14.5" font-weight="700" fill="#23272f">New failure modes</text>
  <text x="446" y="256" font-size="12.5" fill="#6b7280">Error patterns absent from reference data.</text>
  <text x="446" y="274" font-size="12.5" fill="#6b7280">A coverage gap, not a balance problem.</text>
  <text x="412" y="302" font-size="12.5" font-weight="700" fill="#0f7b54">Fix: expand evals — fresh trace analysis, new trace codes.</text>

  <!-- Signal 3 -->
  <rect x="396" y="328" width="336" height="118" rx="11" fill="#ffffff" stroke="#9a6700" stroke-width="1.5"/>
  <circle cx="422" cy="354" r="13" fill="#fff7e0" stroke="#9a6700" stroke-width="1.5"/>
  <text x="422" y="359" font-size="13" font-weight="700" fill="#9a6700" text-anchor="middle">3</text>
  <text x="446" y="352" font-size="14.5" font-weight="700" fill="#23272f">Feedback contradiction</text>
  <text x="446" y="374" font-size="12.5" fill="#6b7280">Evals pass, but thumbs-down / tickets / churn rise.</text>
  <text x="446" y="392" font-size="12.5" fill="#6b7280">You're measuring the wrong thing (most insidious).</text>
  <text x="412" y="420" font-size="12.5" font-weight="700" fill="#9a6700">Fix: update criteria — new judges for missing dimensions.</text>

  <!-- chart -> signals connector -->
  <line x1="340" y1="160" x2="392" y2="145" stroke="#3b6cf6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- caption under chart -->
  <text x="200" y="250" font-size="12.5" fill="#6b7280" text-anchor="middle">A widening band between</text>
  <text x="200" y="268" font-size="12.5" fill="#6b7280" text-anchor="middle">curves is the drift you can</text>
  <text x="200" y="286" font-size="12.5" fill="#6b7280" text-anchor="middle">see; signals 2 and 3 hide</text>
  <text x="200" y="304" font-size="12.5" fill="#6b7280" text-anchor="middle">behind a healthy number.</text>
</svg>
