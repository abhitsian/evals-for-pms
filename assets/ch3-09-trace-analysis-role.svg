<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif">
  <defs>
    <marker id="arrow9" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3b6cf6"/>
    </marker>
  </defs>

  <text x="380" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#23272f">Trace analysis is a team sport</text>
  <text x="380" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Each role catches a different failure class — convergence is how taste becomes a standard</text>

  <!-- four role cards -->
  <g>
    <rect x="30" y="84" width="165" height="120" rx="12" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
    <text x="112" y="110" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e40af">PM</text>
    <text x="112" y="138" text-anchor="middle" font-size="12" fill="#23272f">Names the pattern</text>
    <text x="112" y="158" text-anchor="middle" font-size="12" fill="#23272f">Missed user intent,</text>
    <text x="112" y="176" text-anchor="middle" font-size="12" fill="#23272f">unmet job-to-be-done</text>
    <text x="112" y="196" text-anchor="middle" font-size="11" font-style="italic" fill="#6b7280">leads the review</text>

    <rect x="208" y="84" width="165" height="120" rx="12" fill="#fff7e0" stroke="#9a6700" stroke-width="1.5"/>
    <text x="290" y="110" text-anchor="middle" font-size="14.5" font-weight="700" fill="#9a6700">Engineer</text>
    <text x="290" y="138" text-anchor="middle" font-size="12" fill="#23272f">Tool-execution</text>
    <text x="290" y="158" text-anchor="middle" font-size="12" fill="#23272f">fragility, architecture</text>
    <text x="290" y="176" text-anchor="middle" font-size="12" fill="#23272f">failures in spans</text>
    <text x="290" y="196" text-anchor="middle" font-size="11" font-style="italic" fill="#6b7280">root-cause diagnosis</text>

    <rect x="386" y="84" width="165" height="120" rx="12" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.5"/>
    <text x="468" y="110" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0f7b54">Designer</text>
    <text x="468" y="138" text-anchor="middle" font-size="12" fill="#23272f">UX &amp; formatting,</text>
    <text x="468" y="158" text-anchor="middle" font-size="12" fill="#23272f">readability, output</text>
    <text x="468" y="176" text-anchor="middle" font-size="12" fill="#23272f">structure problems</text>
    <text x="468" y="196" text-anchor="middle" font-size="11" font-style="italic" fill="#6b7280">presentation failures</text>

    <rect x="564" y="84" width="166" height="120" rx="12" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
    <text x="647" y="110" text-anchor="middle" font-size="14.5" font-weight="700" fill="#1e40af">SME</text>
    <text x="647" y="138" text-anchor="middle" font-size="12" fill="#23272f">Domain accuracy,</text>
    <text x="647" y="158" text-anchor="middle" font-size="12" fill="#23272f">subtle factual or</text>
    <text x="647" y="176" text-anchor="middle" font-size="12" fill="#23272f">compliance errors</text>
    <text x="647" y="196" text-anchor="middle" font-size="11" font-style="italic" fill="#6b7280">expert ground truth</text>
  </g>

  <!-- converging arrows -->
  <line x1="112" y1="204" x2="330" y2="248" stroke="#3b6cf6" stroke-width="2" marker-end="url(#arrow9)"/>
  <line x1="290" y1="204" x2="360" y2="248" stroke="#3b6cf6" stroke-width="2" marker-end="url(#arrow9)"/>
  <line x1="468" y1="204" x2="400" y2="248" stroke="#3b6cf6" stroke-width="2" marker-end="url(#arrow9)"/>
  <line x1="647" y1="204" x2="430" y2="248" stroke="#3b6cf6" stroke-width="2" marker-end="url(#arrow9)"/>

  <!-- collaborative loop -->
  <rect x="170" y="256" width="420" height="92" rx="12" fill="#ffffff" stroke="#0f7b54" stroke-width="2"/>
  <text x="380" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#0f7b54">Collaborative labeling loop</text>
  <text x="380" y="306" text-anchor="middle" font-size="12.5" fill="#23272f">Each labels same 20 traces → compare → refine definitions</text>
  <text x="380" y="326" text-anchor="middle" font-size="12.5" fill="#23272f">→ standardize rubric → re-label → repeat</text>

  <!-- agreement gate -->
  <rect x="230" y="366" width="300" height="54" rx="12" fill="#e7f6ef" stroke="#0f7b54" stroke-width="2"/>
  <text x="380" y="390" text-anchor="middle" font-size="15" font-weight="700" fill="#0f7b54">&gt;90% inter-rater agreement</text>
  <text x="380" y="410" text-anchor="middle" font-size="12" fill="#6b7280">the gate before any code goes to automation</text>
  <line x1="380" y1="348" x2="380" y2="364" stroke="#0f7b54" stroke-width="2.5" marker-end="url(#arrow9)"/>
</svg>
