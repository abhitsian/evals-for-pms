<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b6cf6"/>
    </marker>
  </defs>
  <text x="32" y="38" font-size="18" font-weight="700" fill="#23272f">Where traces come from changes with lifecycle</text>
  <text x="32" y="60" font-size="13" fill="#6b7280">The synthetic to production handoff is the key event.</text>

  <!-- Pre-launch panel -->
  <rect x="32" y="84" width="300" height="300" rx="12" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="52" y="112" font-size="15" font-weight="700" fill="#1e40af">PRE-LAUNCH · synthetic</text>
  <text x="52" y="132" font-size="12" fill="#6b7280">clean, only what the team imagined</text>

  <rect x="52" y="148" width="260" height="58" rx="10" fill="#ffffff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="66" y="170" font-size="13.5" font-weight="700" fill="#23272f">AI PRD intents + edge cases</text>
  <text x="66" y="190" font-size="11.5" fill="#6b7280">the inputs the agent must handle</text>

  <rect x="52" y="218" width="260" height="58" rx="10" fill="#ffffff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="66" y="240" font-size="13.5" font-weight="700" fill="#23272f">Run the agent → collect outputs</text>
  <text x="66" y="260" font-size="11.5" fill="#6b7280">input + output = a trace</text>

  <rect x="52" y="288" width="260" height="58" rx="10" fill="#ffffff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="66" y="310" font-size="13.5" font-weight="700" fill="#23272f">Vibe-check golden outputs</text>
  <text x="66" y="330" font-size="11.5" fill="#6b7280">already represent "good"</text>

  <text x="182" y="372" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">→ 20–50 trace seed</text>

  <!-- Handoff arrow -->
  <line x1="338" y1="234" x2="426" y2="234" stroke="#3b6cf6" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="382" y="222" font-size="11" font-weight="700" fill="#9a6700" text-anchor="middle">HANDOFF</text>
  <text x="382" y="255" font-size="10.5" fill="#9a6700" text-anchor="middle">plan from</text>
  <text x="382" y="268" font-size="10.5" fill="#9a6700" text-anchor="middle">day one</text>

  <!-- Post-launch panel -->
  <rect x="432" y="84" width="296" height="300" rx="12" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.5"/>
  <text x="452" y="112" font-size="15" font-weight="700" fill="#0f7b54">POST-LAUNCH · production</text>
  <text x="452" y="132" font-size="12" fill="#6b7280">messy, surprising, humbling</text>

  <rect x="452" y="148" width="256" height="198" rx="10" fill="#ffffff" stroke="#0f7b54" stroke-width="1.5"/>
  <text x="472" y="174" font-size="14" font-weight="700" fill="#23272f">Real production traffic</text>
  <text x="472" y="200" font-size="12" fill="#6b7280">• malformed queries</text>
  <text x="472" y="222" font-size="12" fill="#6b7280">• multi-part requests</text>
  <text x="472" y="244" font-size="12" fill="#6b7280">• niche industries / workflows</text>
  <text x="472" y="266" font-size="12" fill="#6b7280">• scanned PDFs, jargon, edge cases</text>
  <text x="472" y="296" font-size="12.5" font-weight="700" fill="#0f7b54">Continuous growth →</text>
  <text x="472" y="316" font-size="11.5" fill="#6b7280">bias toward failure cases</text>
  <text x="472" y="334" font-size="11.5" fill="#6b7280">the primary source after launch</text>
</svg>
