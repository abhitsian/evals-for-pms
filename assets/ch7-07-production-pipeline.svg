<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b6cf6"/>
    </marker>
  </defs>
  <text x="32" y="38" font-size="18" font-weight="700" fill="#23272f">Growing the dataset is an ongoing pipeline</text>
  <text x="32" y="60" font-size="13" fill="#6b7280">Not a one-time build — a sustainable loop at 10–20 traces / week.</text>

  <!-- 5 steps in a loop -->
  <!-- step 1 -->
  <rect x="40" y="100" width="200" height="84" rx="12" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="56" y="124" font-size="13" font-weight="700" fill="#1e40af">1 · Sample traces</text>
  <text x="56" y="146" font-size="11.5" fill="#6b7280">random + signal-based:</text>
  <text x="56" y="162" font-size="11.5" fill="#6b7280">breadth and depth where</text>
  <text x="56" y="177" font-size="11.5" fill="#6b7280">the agent struggles</text>

  <!-- step 2 -->
  <rect x="280" y="100" width="200" height="84" rx="12" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="296" y="124" font-size="13" font-weight="700" fill="#1e40af">2 · Route to review</text>
  <text x="296" y="146" font-size="11.5" fill="#6b7280">PM, designer, SME or</text>
  <text x="296" y="162" font-size="11.5" fill="#6b7280">labeling team. Queue:</text>
  <text x="296" y="177" font-size="11.5" font-weight="700" fill="#9a6700">10–20 / week, not 200</text>

  <!-- step 3 -->
  <rect x="520" y="100" width="200" height="84" rx="12" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="536" y="124" font-size="13" font-weight="700" fill="#1e40af">3 · Label</text>
  <text x="536" y="146" font-size="11.5" fill="#6b7280">Pass/Fail per criterion,</text>
  <text x="536" y="162" font-size="11.5" fill="#6b7280">trace code, and notes</text>
  <text x="536" y="177" font-size="11.5" fill="#6b7280">for borderline cases</text>

  <!-- arrows top row -->
  <line x1="240" y1="142" x2="278" y2="142" stroke="#3b6cf6" stroke-width="1.8" marker-end="url(#ar)"/>
  <line x1="480" y1="142" x2="518" y2="142" stroke="#3b6cf6" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- down arrow on right -->
  <line x1="620" y1="184" x2="620" y2="240" stroke="#3b6cf6" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- step 4 -->
  <rect x="520" y="248" width="200" height="84" rx="12" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.5"/>
  <text x="536" y="272" font-size="13" font-weight="700" fill="#0f7b54">4 · Add to bucket</text>
  <text x="536" y="294" font-size="11.5" fill="#6b7280">new traces → dev or test;</text>
  <text x="536" y="310" font-size="11.5" fill="#6b7280">train stays small</text>
  <text x="536" y="325" font-size="11.5" fill="#6b7280">and stable</text>

  <!-- step 5 -->
  <rect x="280" y="248" width="200" height="84" rx="12" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.5"/>
  <text x="296" y="272" font-size="13" font-weight="700" fill="#0f7b54">5 · Refresh train</text>
  <text x="296" y="294" font-size="11.5" fill="#6b7280">swap 1–2 few-shot</text>
  <text x="296" y="310" font-size="11.5" fill="#6b7280">examples to track the</text>
  <text x="296" y="325" font-size="11.5" fill="#6b7280">current decision boundary</text>

  <!-- arrow 4->5 -->
  <line x1="518" y1="290" x2="482" y2="290" stroke="#3b6cf6" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- loop back arrow 5 -> 1 -->
  <path d="M280 290 H160 V184" fill="none" stroke="#3b6cf6" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ar)"/>
  <text x="200" y="360" font-size="11.5" font-weight="700" fill="#3b6cf6">repeat continuously →</text>

  <!-- footer -->
  <rect x="40" y="376" width="680" height="36" rx="10" fill="#ffffff" stroke="#23272f" stroke-width="1.5"/>
  <text x="380" y="399" font-size="12.5" fill="#23272f" text-anchor="middle">A sustainable weekly throughput keeps "actual data" actual.</text>
</svg>
