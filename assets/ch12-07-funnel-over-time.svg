<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif">
  <rect width="760" height="440" fill="#ffffff"/>
  <text x="30" y="32" font-size="18" font-weight="700" fill="#23272f">The funnel over time — a living dashboard</text>
  <text x="30" y="54" font-size="13" fill="#6b7280">Plot step-level pass rates across iterations. The bottleneck rises, then the constraint shifts.</text>

  <!-- chart frame -->
  <!-- plot area: x 90..620, y 90..330 ; pass rate 50%..100% -->
  <line x1="90" y1="90" x2="90" y2="330" stroke="#23272f" stroke-width="1.5"/>
  <line x1="90" y1="330" x2="660" y2="330" stroke="#23272f" stroke-width="1.5"/>

  <!-- y gridlines & labels: 50,60,70,80,90,100 -->
  <g font-size="11" fill="#6b7280" text-anchor="end">
    <line x1="90" y1="330" x2="660" y2="330" stroke="#e6e8ee"/><text x="82" y="334">50%</text>
    <line x1="90" y1="282" x2="660" y2="282" stroke="#e6e8ee"/><text x="82" y="286">60%</text>
    <line x1="90" y1="234" x2="660" y2="234" stroke="#e6e8ee"/><text x="82" y="238">70%</text>
    <line x1="90" y1="186" x2="660" y2="186" stroke="#e6e8ee"/><text x="82" y="190">80%</text>
    <line x1="90" y1="138" x2="660" y2="138" stroke="#e6e8ee"/><text x="82" y="142">90%</text>
    <line x1="90" y1="90"  x2="660" y2="90"  stroke="#e6e8ee"/><text x="82" y="94">100%</text>
  </g>

  <!-- x labels: iterations v1..v4 -->
  <g font-size="12" fill="#23272f" text-anchor="middle" font-weight="700">
    <text x="160" y="350">v1</text>
    <text x="320" y="350">v2</text>
    <text x="480" y="350">v3</text>
    <text x="620" y="350">v4</text>
  </g>
  <text x="375" y="372" font-size="12" fill="#6b7280" text-anchor="middle">iteration (run funnel after every major change)</text>

  <!-- y to px: y = 330 - (rate-50)*4.8 ;  76%->206.8, 93%->123.4, etc -->
  <!-- Column Selection line: 76,82,89,93 (amber, rising) -->
  <polyline points="160,205.2 320,176.4 480,142.8 620,123.4" fill="none" stroke="#9a6700" stroke-width="2.5"/>
  <g fill="#9a6700">
    <circle cx="160" cy="205.2" r="4.5"/><circle cx="320" cy="176.4" r="4.5"/>
    <circle cx="480" cy="142.8" r="4.5"/><circle cx="620" cy="123.4" r="4.5"/>
  </g>
  <text x="160" y="222" font-size="11" fill="#9a6700" text-anchor="middle" font-weight="700">76%</text>
  <text x="628" y="118" font-size="11" fill="#9a6700" font-weight="700">93%</text>

  <!-- Table Identification line: 91,91,91,91 then becomes new bottleneck (blue) -->
  <polyline points="160,133.2 320,133.2 480,133.2 620,133.2" fill="none" stroke="#3b6cf6" stroke-width="2.5" stroke-dasharray="0"/>
  <g fill="#3b6cf6">
    <circle cx="160" cy="133.2" r="4"/><circle cx="320" cy="133.2" r="4"/>
    <circle cx="480" cy="133.2" r="4"/><circle cx="620" cy="133.2" r="4"/>
  </g>
  <text x="630" y="150" font-size="11" fill="#3b6cf6" font-weight="700">91%</text>

  <!-- new-bottleneck highlight ring on v4 table point -->
  <circle cx="620" cy="133.2" r="9" fill="none" stroke="#9a6700" stroke-width="1.8" stroke-dasharray="3 2"/>

  <!-- end-to-end line: 55,61,66,70 (dark blue, top context) -->
  <polyline points="160,306 320,277.2 480,253.2 620,234" fill="none" stroke="#1e40af" stroke-width="2" stroke-dasharray="5 4"/>
  <g fill="#1e40af">
    <circle cx="160" cy="306" r="3.5"/><circle cx="320" cy="277.2" r="3.5"/>
    <circle cx="480" cy="253.2" r="3.5"/><circle cx="620" cy="234" r="3.5"/>
  </g>
  <text x="160" y="322" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">55%</text>
  <text x="628" y="230" font-size="11" fill="#1e40af" font-weight="700">70%</text>

  <!-- legend -->
  <g font-size="12" fill="#23272f">
    <rect x="676" y="96" width="14" height="3" fill="#9a6700"/><text x="676" y="120" font-size="11">Column</text><text x="676" y="134" font-size="11">Selection</text>
    <rect x="676" y="150" width="14" height="3" fill="#3b6cf6"/><text x="676" y="174" font-size="11">Table</text><text x="676" y="188" font-size="11">Ident.</text>
    <rect x="676" y="204" width="14" height="3" fill="#1e40af"/><text x="676" y="228" font-size="11">End-to-</text><text x="676" y="242" font-size="11">end</text>
  </g>

  <!-- takeaway -->
  <rect x="30" y="384" width="700" height="44" rx="12" fill="#fff7e0" stroke="#9a6700" stroke-width="1.5"/>
  <text x="48" y="405" font-size="13" fill="#23272f"><tspan font-weight="700" fill="#9a6700">Bottleneck shifts:</tspan> Column Selection climbs 76%→93%, then Table Identification (91%) surfaces as the new constraint.</text>
  <text x="48" y="423" font-size="12.5" fill="#6b7280">The funnel re-prioritizes automatically and catches regressions when a previously-solid step starts to fall.</text>
</svg>
