<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b6cf6"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="380" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#23272f">Same trace, two views</text>

  <!-- LEFT: Generic observability viewer -->
  <rect x="24" y="56" width="332" height="328" rx="12" fill="#ffffff" stroke="#e6e8ee" stroke-width="1.5"/>
  <text x="44" y="84" font-size="15" font-weight="700" fill="#6b7280">Generic observability viewer</text>
  <text x="44" y="103" font-size="12" fill="#6b7280">Langsmith · Arize · Braintrust</text>

  <!-- raw JSON block -->
  <rect x="44" y="116" width="292" height="200" rx="10" fill="#23272f"/>
  <text x="60" y="138" font-size="11.5" fill="#9aa3b2" font-family="ui-monospace, Menlo, monospace">{</text>
  <text x="60" y="156" font-size="11.5" fill="#9aa3b2" font-family="ui-monospace, Menlo, monospace">  "trace_id": "a91f-22c",</text>
  <text x="60" y="174" font-size="11.5" fill="#9aa3b2" font-family="ui-monospace, Menlo, monospace">  "input": "Hi, my refund...",</text>
  <text x="60" y="192" font-size="11.5" fill="#9aa3b2" font-family="ui-monospace, Menlo, monospace">  "output": "&lt;html&gt;\\n  Dear</text>
  <text x="60" y="210" font-size="11.5" fill="#9aa3b2" font-family="ui-monospace, Menlo, monospace">  cust\\u2026\\nThanks,\\n&lt;/html&gt;",</text>
  <text x="60" y="228" font-size="11.5" fill="#9aa3b2" font-family="ui-monospace, Menlo, monospace">  "tool_calls": [{...}, {...}],</text>
  <text x="60" y="246" font-size="11.5" fill="#9aa3b2" font-family="ui-monospace, Menlo, monospace">  "sys_tokens": 1842,</text>
  <text x="60" y="264" font-size="11.5" fill="#9aa3b2" font-family="ui-monospace, Menlo, monospace">  "latency_ms": 3120,</text>
  <text x="60" y="282" font-size="11.5" fill="#9aa3b2" font-family="ui-monospace, Menlo, monospace">  "meta": {...}</text>
  <text x="60" y="300" font-size="11.5" fill="#9aa3b2" font-family="ui-monospace, Menlo, monospace">}</text>

  <rect x="44" y="328" width="292" height="42" rx="9" fill="#fff7e0" stroke="#9a6700" stroke-width="1.5"/>
  <text x="190" y="346" text-anchor="middle" font-size="13" font-weight="700" fill="#9a6700">~2 min to reconstruct</text>
  <text x="190" y="362" text-anchor="middle" font-size="11.5" fill="#9a6700">no rendering · no context · no rubric</text>

  <!-- arrow between -->
  <line x1="364" y1="220" x2="402" y2="220" stroke="#3b6cf6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- RIGHT: Custom trace app -->
  <rect x="408" y="56" width="328" height="328" rx="12" fill="#ffffff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="428" y="84" font-size="15" font-weight="700" fill="#1e40af">Custom trace app</text>
  <text x="428" y="103" font-size="12" fill="#6b7280">vibecoded · fits your workflow</text>

  <!-- rendered email -->
  <rect x="428" y="116" width="192" height="160" rx="10" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="444" y="136" font-size="11" fill="#6b7280">From: support@acme.com</text>
  <text x="444" y="152" font-size="12" font-weight="700" fill="#23272f">Re: Your refund request</text>
  <line x1="444" y1="160" x2="604" y2="160" stroke="#e6e8ee" stroke-width="1"/>
  <text x="444" y="178" font-size="11.5" fill="#23272f">Dear customer,</text>
  <text x="444" y="196" font-size="11.5" fill="#23272f">Your refund of $48.00 has</text>
  <text x="444" y="212" font-size="11.5" fill="#23272f">been approved and will post</text>
  <text x="444" y="228" font-size="11.5" fill="#23272f">in 3–5 business days.</text>
  <text x="444" y="252" font-size="11.5" fill="#23272f">Thanks,</text>
  <text x="444" y="268" font-size="11.5" fill="#23272f">Acme Support</text>

  <!-- context panel -->
  <rect x="628" y="116" width="92" height="160" rx="10" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.5"/>
  <text x="640" y="134" font-size="10.5" font-weight="700" fill="#0f7b54">CONTEXT</text>
  <text x="640" y="152" font-size="10" fill="#6b7280">Tier</text>
  <text x="640" y="166" font-size="11" font-weight="700" fill="#23272f">Enterprise</text>
  <text x="640" y="186" font-size="10" fill="#6b7280">History</text>
  <text x="640" y="200" font-size="11" font-weight="700" fill="#23272f">12 tickets</text>
  <text x="640" y="220" font-size="10" fill="#6b7280">Open</text>
  <text x="640" y="234" font-size="11" font-weight="700" fill="#23272f">#4471</text>
  <text x="640" y="254" font-size="10" fill="#6b7280">Sentiment</text>
  <text x="640" y="268" font-size="11" font-weight="700" fill="#23272f">Neutral</text>

  <!-- Pass / Fail buttons -->
  <rect x="428" y="288" width="142" height="40" rx="9" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.5"/>
  <text x="499" y="313" text-anchor="middle" font-size="14" font-weight="700" fill="#0f7b54">Pass  (Y)</text>
  <rect x="578" y="288" width="142" height="40" rx="9" fill="#ffffff" stroke="#9a6700" stroke-width="1.5"/>
  <text x="649" y="313" text-anchor="middle" font-size="14" font-weight="700" fill="#9a6700">Fail  (F)</text>

  <rect x="428" y="336" width="292" height="34" rx="9" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="574" y="358" text-anchor="middle" font-size="13" font-weight="700" fill="#1e40af">~10 sec to scan &amp; label</text>
</svg>
