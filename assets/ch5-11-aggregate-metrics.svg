<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif">
  <rect width="760" height="440" fill="#ffffff"/>
  <text x="40" y="46" font-size="18" font-weight="700" fill="#23272f">Aggregate metrics — the dataset-run view</text>
  <text x="40" y="70" font-size="13" fill="#6b7280">Read the aggregate over the 50-row golden set, not individual rows.</text>

  <!-- Pass rate vs baseline -->
  <text x="40" y="108" font-size="14" font-weight="700" fill="#1e40af">Pass rate vs baseline (per eval)</text>

  <!-- baseline reference dashed -->
  <!-- chart: x 40..400, bars -->
  <g font-size="11.5" fill="#6b7280">
    <text x="40" y="300">0%</text>
    <text x="40" y="148">100%</text>
  </g>

  <!-- Category eval: baseline 92, now 78 -->
  <rect x="90" y="158" width="42" height="138" rx="4" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1"/>
  <line x1="86" y1="160" x2="136" y2="160" stroke="#1e40af" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="90" y="200" width="42" height="96" rx="4" fill="#fff7e0" stroke="#9a6700" stroke-width="1.5"/>
  <text x="111" y="316" font-size="11.5" fill="#23272f" text-anchor="middle">Category</text>
  <text x="111" y="332" font-size="11" fill="#b3236a" text-anchor="middle">92→78%</text>

  <!-- Schema: 100 stable -->
  <rect x="180" y="152" width="42" height="144" rx="4" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.5"/>
  <line x1="176" y1="152" x2="226" y2="152" stroke="#1e40af" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="201" y="316" font-size="11.5" fill="#23272f" text-anchor="middle">Schema</text>
  <text x="201" y="332" font-size="11" fill="#0f7b54" text-anchor="middle">100%</text>

  <!-- Invented IDs: baseline 98 now 96 -->
  <rect x="270" y="155" width="42" height="141" rx="4" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.5"/>
  <line x1="266" y1="153" x2="316" y2="153" stroke="#1e40af" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="291" y="316" font-size="11.5" fill="#23272f" text-anchor="middle">IDs</text>
  <text x="291" y="332" font-size="11" fill="#0f7b54" text-anchor="middle">96%</text>

  <!-- Latency: baseline 99 now 70 -->
  <rect x="360" y="159" width="42" height="137" rx="4" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1"/>
  <line x1="356" y1="159" x2="406" y2="159" stroke="#1e40af" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="360" y="195" width="42" height="101" rx="4" fill="#fff7e0" stroke="#9a6700" stroke-width="1.5"/>
  <text x="381" y="316" font-size="11.5" fill="#23272f" text-anchor="middle">Latency</text>
  <text x="381" y="332" font-size="11" fill="#b3236a" text-anchor="middle">99→70%</text>

  <text x="90" y="356" font-size="11" fill="#6b7280">dashed = baseline · fill = current run</text>

  <!-- Failure distribution -->
  <rect x="460" y="96" width="260" height="150" rx="12" fill="#ffffff" stroke="#e6e8ee" stroke-width="1.5"/>
  <text x="480" y="124" font-size="14" font-weight="700" fill="#1e40af">Failure distribution</text>
  <text x="480" y="150" font-size="12.5" fill="#23272f">Short tickets</text>
  <rect x="600" y="140" width="100" height="12" rx="6" fill="#fff7e0" stroke="#9a6700" stroke-width="1"/>
  <text x="480" y="180" font-size="12.5" fill="#23272f">Ambiguous</text>
  <rect x="600" y="170" width="70" height="12" rx="6" fill="#fff7e0" stroke="#9a6700" stroke-width="1"/>
  <text x="480" y="210" font-size="12.5" fill="#23272f">Non-English</text>
  <rect x="600" y="200" width="86" height="12" rx="6" fill="#fff7e0" stroke="#9a6700" stroke-width="1"/>
  <text x="480" y="236" font-size="11.5" fill="#6b7280">failures cluster on input type</text>

  <!-- Cross-eval correlation -->
  <rect x="460" y="262" width="260" height="120" rx="12" fill="#ffffff" stroke="#e6e8ee" stroke-width="1.5"/>
  <text x="480" y="290" font-size="14" font-weight="700" fill="#1e40af">Cross-eval correlation</text>
  <text x="480" y="316" font-size="12.5" fill="#23272f">Rows failing 2+ evals together</text>
  <text x="480" y="336" font-size="12.5" fill="#23272f">= input complexity,</text>
  <text x="480" y="356" font-size="12.5" fill="#23272f">not independent bugs.</text>

  <text x="40" y="418" font-size="12" fill="#6b7280">A 92%→78% drop is a failure even when spot-checked outputs look fine.</text>
</svg>
