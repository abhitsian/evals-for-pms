<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="100%" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b6cf6"/>
    </marker>
  </defs>

  <text x="30" y="34" font-size="18" font-weight="700" fill="#23272f">Simulation-based evaluation</text>
  <text x="30" y="56" font-size="13" fill="#6b7280">An LLM plays a real user across 8–12 branching turns — what static rows can't test.</text>

  <!-- persona card -->
  <rect x="30" y="84" width="220" height="180" rx="12" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="48" y="112" font-size="14" font-weight="700" fill="#1e40af">Simulated user persona</text>
  <line x1="48" y1="122" x2="232" y2="122" stroke="#e6e8ee" stroke-width="1.5"/>

  <text x="48" y="146" font-size="12" font-weight="700" fill="#23272f">Goal</text>
  <text x="48" y="164" font-size="12" fill="#6b7280">Get Q1 enterprise signup rate</text>

  <text x="48" y="190" font-size="12" font-weight="700" fill="#23272f">Communication style</text>
  <text x="48" y="208" font-size="12" fill="#6b7280">Terse, asks vague first</text>

  <text x="48" y="234" font-size="12" font-weight="700" fill="#23272f">Frustration trigger</text>
  <text x="48" y="252" font-size="12" fill="#6b7280">Re-asks if answer is generic</text>

  <!-- conversation: branching turns -->
  <text x="300" y="104" font-size="14" font-weight="700" fill="#0f7b54">Multi-turn conversation</text>

  <!-- turn 1 user -->
  <rect x="300" y="116" width="200" height="36" rx="10" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.5"/>
  <text x="312" y="139" font-size="12" fill="#23272f">U: "show me signups"</text>
  <!-- turn 1 agent (clarify) -->
  <rect x="520" y="116" width="210" height="36" rx="10" fill="#ffffff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="532" y="139" font-size="12" fill="#23272f">A: "which metric / period?"</text>

  <line x1="400" y1="152" x2="400" y2="166" stroke="#3b6cf6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- turn 2 user follow-up -->
  <rect x="300" y="168" width="230" height="36" rx="10" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.5"/>
  <text x="312" y="191" font-size="12" fill="#23272f">U: "enterprise, weekly, Q1"</text>
  <rect x="544" y="168" width="186" height="36" rx="10" fill="#ffffff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="556" y="191" font-size="12" fill="#23272f">A: returns a chart</text>

  <line x1="400" y1="204" x2="400" y2="218" stroke="#3b6cf6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- turn 3 correction (branch) -->
  <rect x="300" y="220" width="250" height="36" rx="10" fill="#fff7e0" stroke="#9a6700" stroke-width="1.5"/>
  <text x="312" y="243" font-size="12" fill="#23272f">U: "no — completed signups"</text>
  <text x="560" y="237" font-size="11" fill="#9a6700">course-correction</text>
  <text x="560" y="252" font-size="11" fill="#9a6700">branch</text>

  <line x1="400" y1="256" x2="400" y2="270" stroke="#3b6cf6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- turn 4 -->
  <rect x="300" y="272" width="250" height="36" rx="10" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.5"/>
  <text x="312" y="295" font-size="12" fill="#23272f">U: "and vs last year?"</text>
  <text x="560" y="294" font-size="11" fill="#6b7280">… 8–12 turns</text>

  <!-- static vs simulation contrast -->
  <rect x="30" y="300" width="220" height="60" rx="12" fill="#ffffff" stroke="#e6e8ee" stroke-width="1.5"/>
  <text x="48" y="324" font-size="12" font-weight="700" fill="#6b7280">Static dataset</text>
  <text x="48" y="346" font-size="12" fill="#6b7280">one input → one output row</text>

  <!-- validate against production -->
  <rect x="30" y="388" width="700" height="52" rx="12" fill="#fff7e0" stroke="#9a6700" stroke-width="1.5"/>
  <text x="50" y="412" font-size="13" font-weight="700" fill="#9a6700">Always validate against production traces.</text>
  <text x="50" y="430" font-size="12" fill="#23272f">Sim shows 90% goal completion but prod shows 70% → the personas are wrong. Fix them.</text>
</svg>
