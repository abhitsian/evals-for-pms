<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="100%" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif">
  <rect width="760" height="360" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b6cf6"/>
    </marker>
  </defs>
  <text x="40" y="46" font-size="18" font-weight="700" fill="#23272f">Anatomy of an eval</text>
  <text x="40" y="70" font-size="13" fill="#6b7280">Three parts — and the reason string is part of the contract, not an extra.</text>

  <!-- 1 Inputs -->
  <rect x="40" y="120" width="200" height="150" rx="12" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="62" y="150" font-size="13" font-weight="700" fill="#3b6cf6">1 · INPUTS</text>
  <text x="62" y="176" font-size="14" font-weight="700" fill="#23272f">The trace</text>
  <text x="62" y="200" font-size="12.5" fill="#23272f">output string · JSON ·</text>
  <text x="62" y="219" font-size="12.5" fill="#23272f">tool-call log</text>
  <text x="62" y="244" font-size="12.5" fill="#6b7280">(+ original user input</text>
  <text x="62" y="261" font-size="12.5" fill="#6b7280">for context checks)</text>

  <!-- 2 Check -->
  <rect x="280" y="120" width="200" height="150" rx="12" fill="#fff7e0" stroke="#9a6700" stroke-width="1.5"/>
  <text x="302" y="150" font-size="13" font-weight="700" fill="#9a6700">2 · CHECK</text>
  <text x="302" y="176" font-size="14" font-weight="700" fill="#23272f">The logic</text>
  <text x="302" y="200" font-size="12.5" fill="#23272f">condition · pattern match</text>
  <text x="302" y="219" font-size="12.5" fill="#23272f">schema · count ·</text>
  <text x="302" y="238" font-size="12.5" fill="#23272f">threshold compare</text>
  <text x="302" y="262" font-size="12" fill="#6b7280" font-style="italic">no language understanding</text>

  <!-- 3 Output -->
  <rect x="520" y="120" width="200" height="150" rx="12" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.5"/>
  <text x="542" y="150" font-size="13" font-weight="700" fill="#0f7b54">3 · OUTPUT</text>
  <text x="542" y="178" font-size="14" font-weight="700" fill="#0f7b54">PASS / FAIL</text>
  <text x="542" y="204" font-size="13" font-weight="700" fill="#23272f">+ reason string</text>
  <text x="542" y="228" font-size="12.5" fill="#23272f">"No valid category</text>
  <text x="542" y="245" font-size="12.5" fill="#23272f">label found"</text>
  <text x="542" y="263" font-size="12" fill="#b3236a" font-style="italic">"False" tells you nothing</text>

  <!-- arrows -->
  <line x1="240" y1="195" x2="278" y2="195" stroke="#3b6cf6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="195" x2="518" y2="195" stroke="#3b6cf6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="40" y="320" font-size="12" fill="#6b7280">Deterministic: same input → same result, every time.</text>
</svg>
