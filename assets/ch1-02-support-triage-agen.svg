<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="100%" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b6cf6"/>
    </marker>
  </defs>

  <text x="30" y="36" font-size="18" font-weight="700" fill="#23272f">Support Triage Agent — the prototype</text>
  <text x="30" y="58" font-size="13" fill="#6b7280">A prompt + examples + a data connector. Not a built feature.</text>

  <!-- Connector / data in -->
  <rect x="30" y="88" width="170" height="120" rx="11" fill="#fff7e0" stroke="#9a6700" stroke-width="1.5"/>
  <text x="115" y="112" font-size="14" font-weight="700" fill="#9a6700" text-anchor="middle">Data connector</text>
  <text x="115" y="134" font-size="12" fill="#23272f" text-anchor="middle">Sample of triaged</text>
  <text x="115" y="150" font-size="12" fill="#23272f" text-anchor="middle">support tickets</text>
  <line x1="46" y1="166" x2="184" y2="166" stroke="#e6e8ee" stroke-width="1"/>
  <text x="115" y="184" font-size="11.5" fill="#6b7280" text-anchor="middle">"Charged twice…"</text>
  <text x="115" y="199" font-size="11.5" fill="#6b7280" text-anchor="middle">"502 on export…"</text>

  <line x1="200" y1="148" x2="248" y2="148" stroke="#3b6cf6" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- System prompt -->
  <rect x="252" y="88" width="478" height="120" rx="11" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="272" y="112" font-size="14" font-weight="700" fill="#1e40af">System prompt</text>
  <text x="272" y="138" font-size="13" fill="#23272f">"You are a customer support analyst. For each ticket,</text>
  <text x="272" y="158" font-size="13" fill="#23272f">categorize the issue, assess customer sentiment, and</text>
  <text x="272" y="178" font-size="13" fill="#23272f">flag any ticket that needs urgent human attention."</text>

  <line x1="491" y1="208" x2="491" y2="240" stroke="#3b6cf6" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="540" y="228" font-size="12" fill="#6b7280">three tasks</text>

  <!-- Task 1 -->
  <rect x="30" y="252" width="226" height="180" rx="11" fill="#ffffff" stroke="#e6e8ee" stroke-width="1.5"/>
  <text x="50" y="278" font-size="14" font-weight="700" fill="#23272f">1 · Categorize</text>
  <rect x="50" y="292" width="120" height="24" rx="7" fill="#eaf0ff"/>
  <text x="110" y="309" font-size="12" fill="#1e40af" text-anchor="middle">Technical</text>
  <rect x="50" y="324" width="120" height="24" rx="7" fill="#eaf0ff"/>
  <text x="110" y="341" font-size="12" fill="#1e40af" text-anchor="middle">Billing</text>
  <rect x="50" y="356" width="160" height="24" rx="7" fill="#eaf0ff"/>
  <text x="130" y="373" font-size="12" fill="#1e40af" text-anchor="middle">Feature Request</text>

  <!-- Task 2 -->
  <rect x="267" y="252" width="226" height="180" rx="11" fill="#ffffff" stroke="#e6e8ee" stroke-width="1.5"/>
  <text x="287" y="278" font-size="14" font-weight="700" fill="#23272f">2 · Sentiment</text>
  <rect x="287" y="292" width="186" height="24" rx="7" fill="#e7f6ef"/>
  <text x="380" y="309" font-size="12" fill="#0f7b54" text-anchor="middle">Positive · Neutral</text>
  <rect x="287" y="324" width="186" height="24" rx="7" fill="#fff7e0"/>
  <text x="380" y="341" font-size="12" fill="#9a6700" text-anchor="middle">Frustrated</text>
  <rect x="287" y="356" width="186" height="24" rx="7" fill="#fff7e0"/>
  <text x="380" y="373" font-size="12" fill="#9a6700" text-anchor="middle">Angry</text>

  <!-- Task 3 -->
  <rect x="504" y="252" width="226" height="180" rx="11" fill="#ffffff" stroke="#e6e8ee" stroke-width="1.5"/>
  <text x="524" y="278" font-size="14" font-weight="700" fill="#23272f">3 · Urgency flag</text>
  <text x="524" y="300" font-size="12" fill="#6b7280">Flag Frustrated / Angry</text>
  <rect x="524" y="312" width="186" height="24" rx="7" fill="#fff7e0"/>
  <text x="617" y="329" font-size="12" fill="#9a6700" text-anchor="middle">High</text>
  <rect x="524" y="344" width="186" height="24" rx="7" fill="#fff7e0" stroke="#9a6700" stroke-width="1.5"/>
  <text x="617" y="361" font-size="12" font-weight="700" fill="#9a6700" text-anchor="middle">Critical</text>
  <text x="524" y="394" font-size="11" fill="#6b7280">→ route to human</text>
</svg>
