<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif">
  <rect width="760" height="440" fill="#ffffff"/>
  <defs>
    <marker id="arrow6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b6cf6"/>
    </marker>
  </defs>
  <text x="40" y="46" font-size="18" font-weight="700" fill="#23272f">Check — tool-call order</text>
  <text x="40" y="70" font-size="13" fill="#6b7280">Logs are structured data — this underused category is high-value and cheap.</text>

  <!-- expected sequence -->
  <text x="40" y="112" font-size="13" font-weight="700" fill="#1e40af">Expected sequence</text>
  <rect x="40" y="124" width="190" height="56" rx="10" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="60" y="150" font-size="13" font-weight="700" fill="#23272f">Subscription_Check</text>
  <text x="60" y="168" font-size="11.5" fill="#6b7280" font-family="ui-monospace, Menlo, monospace">user_id ✓</text>
  <line x1="232" y1="152" x2="266" y2="152" stroke="#3b6cf6" stroke-width="1.5" marker-end="url(#arrow6)"/>
  <rect x="268" y="124" width="190" height="56" rx="10" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="288" y="150" font-size="13" font-weight="700" fill="#23272f">Resolution_Step</text>
  <text x="288" y="168" font-size="11.5" fill="#6b7280" font-family="ui-monospace, Menlo, monospace">params ✓</text>
  <line x1="460" y1="152" x2="494" y2="152" stroke="#3b6cf6" stroke-width="1.5" marker-end="url(#arrow6)"/>
  <rect x="496" y="124" width="220" height="56" rx="10" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="516" y="150" font-size="13" font-weight="700" fill="#23272f">Escalation</text>
  <text x="516" y="168" font-size="11.5" fill="#6b7280" font-family="ui-monospace, Menlo, monospace">only if severity ≥ T</text>

  <!-- PASS run -->
  <rect x="40" y="206" width="676" height="88" rx="12" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.5"/>
  <text x="62" y="234" font-size="14" font-weight="700" fill="#0f7b54">PASS</text>
  <text x="120" y="234" font-size="13" fill="#23272f" font-family="ui-monospace, Menlo, monospace">[Subscription_Check, Resolution_Step]</text>
  <text x="62" y="262" font-size="12.5" fill="#23272f">Correct order, correct user_id, no premature escalation.</text>
  <text x="62" y="282" font-size="12" fill="#6b7280" font-style="italic">reason: "tool sequence matches expected path"</text>

  <!-- FAIL run -->
  <rect x="40" y="312" width="676" height="100" rx="12" fill="#fff7e0" stroke="#9a6700" stroke-width="1.5"/>
  <text x="62" y="340" font-size="14" font-weight="700" fill="#b3236a">FAIL</text>
  <text x="120" y="340" font-size="13" fill="#23272f" font-family="ui-monospace, Menlo, monospace">[Resolution_Step, Subscription_Check]</text>
  <text x="62" y="368" font-size="12.5" fill="#23272f">Resolution_Step ran before Subscription_Check — order violated.</text>
  <text x="62" y="392" font-size="12" fill="#6b7280" font-style="italic">reason: "Resolution_Step called before Subscription_Check"</text>
</svg>
