<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b6cf6"/>
    </marker>
  </defs>

  <text x="30" y="34" font-size="18" font-weight="700" fill="#23272f">Layered eval investment</text>
  <text x="30" y="56" font-size="13" fill="#6b7280">Add layers in cost / leverage order — not all four at once.</text>

  <!-- Layer 1 -->
  <rect x="30" y="84" width="700" height="64" rx="12" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.5"/>
  <circle cx="62" cy="116" r="15" fill="#0f7b54"/>
  <text x="62" y="121" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="92" y="111" font-size="15" font-weight="700" fill="#23272f">Binary success criteria</text>
  <text x="92" y="132" font-size="12" fill="#6b7280">Define pass/fail for routing, each skill, and the full path.</text>
  <text x="710" y="118" font-size="11" fill="#0f7b54" text-anchor="end">cheapest</text>

  <line x1="380" y1="148" x2="380" y2="164" stroke="#3b6cf6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 2 -->
  <rect x="30" y="166" width="700" height="64" rx="12" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
  <circle cx="62" cy="198" r="15" fill="#3b6cf6"/>
  <text x="62" y="203" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="92" y="193" font-size="15" font-weight="700" fill="#23272f">Code evals — routing + skills</text>
  <text x="92" y="214" font-size="12" fill="#6b7280">Deterministic checks; fastest, highest leverage. Build these first.</text>

  <line x1="380" y1="230" x2="380" y2="246" stroke="#3b6cf6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 3 -->
  <rect x="30" y="248" width="700" height="64" rx="12" fill="#fff7e0" stroke="#9a6700" stroke-width="1.5"/>
  <circle cx="62" cy="280" r="15" fill="#9a6700"/>
  <text x="62" y="285" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="92" y="275" font-size="15" font-weight="700" fill="#23272f">LLM judges — full path</text>
  <text x="92" y="296" font-size="12" fill="#6b7280">Open-ended quality, once component evals are stable.</text>

  <line x1="380" y1="312" x2="380" y2="328" stroke="#3b6cf6" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Layer 4 -->
  <rect x="30" y="330" width="700" height="64" rx="12" fill="#23272f" stroke="#23272f" stroke-width="1.5"/>
  <circle cx="62" cy="362" r="15" fill="#ffffff"/>
  <text x="62" y="367" font-size="14" font-weight="700" fill="#23272f" text-anchor="middle">4</text>
  <text x="92" y="357" font-size="15" font-weight="700" fill="#ffffff">Simulation — multi-turn</text>
  <text x="92" y="378" font-size="12" fill="#e6e8ee">Long-horizon testing, once you have a component + full-path baseline.</text>
  <text x="710" y="364" font-size="11" fill="#e6e8ee" text-anchor="end">richest</text>

  <!-- side axis -->
  <text x="20" y="245" font-size="11" font-weight="700" fill="#6b7280" text-anchor="middle" transform="rotate(-90 20 245)">cost &amp; coverage increase ↑</text>
</svg>
