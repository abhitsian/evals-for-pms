<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#3b6cf6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="440" fill="#ffffff"/>
  <text x="32" y="40" font-size="18" font-weight="700" fill="#23272f">The offline–online gap widens silently</text>
  <text x="32" y="62" font-size="13" fill="#6b7280">Offline pass rate keeps climbing while real-world quality quietly falls. Instrument the gap.</text>

  <!-- Chart frame -->
  <g>
    <!-- axes -->
    <line x1="90" y1="100" x2="90" y2="360" stroke="#23272f" stroke-width="1.5"/>
    <line x1="90" y1="360" x2="690" y2="360" stroke="#23272f" stroke-width="1.5"/>
    <!-- y labels -->
    <text x="80" y="106" font-size="12" fill="#6b7280" text-anchor="end">100%</text>
    <text x="80" y="234" font-size="12" fill="#6b7280" text-anchor="end">80%</text>
    <text x="80" y="364" font-size="12" fill="#6b7280" text-anchor="end">60%</text>
    <!-- gridlines -->
    <line x1="90" y1="100" x2="690" y2="100" stroke="#e6e8ee" stroke-width="1"/>
    <line x1="90" y1="234" x2="690" y2="234" stroke="#e6e8ee" stroke-width="1"/>
    <!-- x labels -->
    <text x="150" y="382" font-size="12" fill="#6b7280" text-anchor="middle">Week 0</text>
    <text x="390" y="382" font-size="12" fill="#6b7280" text-anchor="middle">Week 4</text>
    <text x="630" y="382" font-size="12" fill="#6b7280" text-anchor="middle">Week 8</text>

    <!-- gap shaded band between curves -->
    <path d="M150,150 C270,138 330,130 390,124 C480,116 570,110 630,106
             L630,300 C570,278 480,250 390,222 C330,204 270,182 150,162 Z"
          fill="#fff7e0" opacity="0.85"/>

    <!-- offline curve (rising, green) -->
    <path d="M150,150 C270,138 330,130 390,124 C480,116 570,110 630,106"
          fill="none" stroke="#0f7b54" stroke-width="3"/>
    <!-- online curve (falling, amber) -->
    <path d="M150,162 C270,182 330,204 390,222 C480,250 570,278 630,300"
          fill="none" stroke="#9a6700" stroke-width="3" stroke-dasharray="2 0"/>

    <!-- endpoints -->
    <circle cx="630" cy="106" r="4.5" fill="#0f7b54"/>
    <circle cx="630" cy="300" r="4.5" fill="#9a6700"/>

    <!-- gap arrow -->
    <line x1="558" y1="112" x2="558" y2="284" stroke="#3b6cf6" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)" stroke-dasharray="4 3"/>
    <rect x="480" y="186" width="120" height="30" rx="8" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
    <text x="540" y="205" font-size="12" font-weight="700" fill="#1e40af" text-anchor="middle">THE GAP</text>
  </g>

  <!-- legend -->
  <g>
    <line x1="120" y1="408" x2="148" y2="408" stroke="#0f7b54" stroke-width="3"/>
    <text x="154" y="412" font-size="13" fill="#23272f">Offline pass rate (what you measure)</text>
    <line x1="440" y1="408" x2="468" y2="408" stroke="#9a6700" stroke-width="3"/>
    <text x="474" y="412" font-size="13" fill="#23272f">Real-world quality (what users feel)</text>
  </g>
</svg>
