<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="100%" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3b6cf6"/>
    </marker>
  </defs>

  <text x="30" y="38" font-size="18" font-weight="700" fill="#23272f">When to build an eval — the three-question decision tree</text>
  <text x="30" y="60" font-size="13" fill="#6b7280">Run every bad-trace category through these in order. Most are not eval candidates.</text>

  <!-- Start -->
  <rect x="290" y="78" width="180" height="44" rx="12" fill="#eaf0ff" stroke="#1e40af" stroke-width="1.5"/>
  <text x="380" y="105" font-size="13.5" font-weight="600" fill="#1e40af" text-anchor="middle">A bad trace category</text>

  <!-- Q1 -->
  <rect x="240" y="148" width="280" height="56" rx="12" fill="#ffffff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="380" y="172" font-size="13.5" font-weight="700" fill="#23272f" text-anchor="middle">Q1 — Specification check</text>
  <text x="380" y="192" font-size="12.5" fill="#6b7280" text-anchor="middle">Was the prompt clearly meant to handle this?</text>
  <line x1="380" y1="122" x2="380" y2="146" stroke="#3b6cf6" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Q1 NO branch -->
  <line x1="240" y1="176" x2="120" y2="176" stroke="#3b6cf6" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="178" y="168" font-size="11.5" fill="#9a6700" font-weight="700" text-anchor="middle">NO</text>
  <rect x="20" y="206" width="180" height="74" rx="12" fill="#fff7e0" stroke="#9a6700" stroke-width="1.5"/>
  <text x="110" y="230" font-size="13" font-weight="700" fill="#9a6700" text-anchor="middle">Specification gap</text>
  <text x="110" y="251" font-size="12" fill="#23272f" text-anchor="middle">Update the system</text>
  <text x="110" y="267" font-size="12" fill="#23272f" text-anchor="middle">prompt</text>
  <line x1="110" y1="176" x2="110" y2="204" stroke="#3b6cf6" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Q1 YES to Q2 -->
  <line x1="380" y1="204" x2="380" y2="228" stroke="#3b6cf6" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="396" y="222" font-size="11.5" fill="#0f7b54" font-weight="700">YES</text>

  <!-- Q2 -->
  <rect x="240" y="230" width="280" height="56" rx="12" fill="#ffffff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="380" y="254" font-size="13.5" font-weight="700" fill="#23272f" text-anchor="middle">Q2 — System check</text>
  <text x="380" y="274" font-size="12.5" fill="#6b7280" text-anchor="middle">Does the agent ever work here at all?</text>

  <!-- Q2 NO branch -->
  <line x1="520" y1="258" x2="640" y2="258" stroke="#3b6cf6" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="582" y="250" font-size="11.5" fill="#9a6700" font-weight="700" text-anchor="middle">NEVER</text>
  <rect x="560" y="288" width="180" height="74" rx="12" fill="#fff7e0" stroke="#9a6700" stroke-width="1.5"/>
  <text x="650" y="312" font-size="13" font-weight="700" fill="#9a6700" text-anchor="middle">Architectural issue</text>
  <text x="650" y="333" font-size="12" fill="#23272f" text-anchor="middle">Engineering fix —</text>
  <text x="650" y="349" font-size="12" fill="#23272f" text-anchor="middle">integration / tool / model</text>
  <line x1="650" y1="258" x2="650" y2="286" stroke="#3b6cf6" stroke-width="2" marker-end="url(#arr2)"/>

  <!-- Q2 YES (works sometimes) to Q3 -->
  <line x1="380" y1="286" x2="380" y2="310" stroke="#3b6cf6" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="402" y="304" font-size="11.5" fill="#0f7b54" font-weight="700">SOMETIMES</text>

  <!-- Q3 -->
  <rect x="240" y="312" width="280" height="56" rx="12" fill="#ffffff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="380" y="336" font-size="13.5" font-weight="700" fill="#23272f" text-anchor="middle">Q3 — Generalization check</text>
  <text x="380" y="356" font-size="12.5" fill="#6b7280" text-anchor="middle">Works in some cases, fails in others?</text>

  <!-- Q3 YES outcome -->
  <line x1="380" y1="368" x2="380" y2="392" stroke="#3b6cf6" stroke-width="2" marker-end="url(#arr2)"/>
  <text x="396" y="386" font-size="11.5" fill="#0f7b54" font-weight="700">YES</text>
  <rect x="250" y="394" width="260" height="58" rx="12" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.5"/>
  <text x="380" y="419" font-size="14" font-weight="700" fill="#0f7b54" text-anchor="middle">Generalization error</text>
  <text x="380" y="439" font-size="13" fill="#23272f" text-anchor="middle">Build an automated eval</text>
</svg>
