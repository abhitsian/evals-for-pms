<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="100%" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif">
  <rect width="760" height="420" fill="#ffffff"/>
  <defs>
    <marker id="arrow9" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b6cf6"/>
    </marker>
  </defs>
  <text x="40" y="46" font-size="18" font-weight="700" fill="#23272f">Check — invented IDs (Eval 2, hallucination guard)</text>
  <text x="40" y="70" font-size="13" fill="#6b7280">Some checks need the input — hallucination can't be seen from the output alone.</text>

  <!-- input -->
  <rect x="40" y="100" width="300" height="120" rx="12" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="62" y="130" font-size="13" font-weight="700" fill="#1e40af">INPUT — ticket IDs present</text>
  <text x="62" y="158" font-size="13.5" fill="#23272f" font-family="ui-monospace, Menlo, monospace">TCK-1043</text>
  <text x="62" y="182" font-size="13.5" fill="#23272f" font-family="ui-monospace, Menlo, monospace">TCK-1088</text>
  <text x="62" y="206" font-size="12" fill="#6b7280">the set of valid IDs</text>

  <!-- output -->
  <rect x="420" y="100" width="300" height="120" rx="12" fill="#ffffff" stroke="#9a6700" stroke-width="1.5"/>
  <text x="442" y="130" font-size="13" font-weight="700" fill="#9a6700">OUTPUT — IDs referenced</text>
  <text x="442" y="158" font-size="13.5" fill="#0f7b54" font-family="ui-monospace, Menlo, monospace">TCK-1043  ✓ in input</text>
  <text x="442" y="182" font-size="13.5" fill="#b3236a" font-family="ui-monospace, Menlo, monospace">TCK-2299  ✗ invented</text>
  <text x="442" y="206" font-size="12" fill="#6b7280">compare against input set</text>

  <line x1="342" y1="160" x2="418" y2="160" stroke="#3b6cf6" stroke-width="1.5" marker-end="url(#arrow9)"/>

  <!-- code -->
  <rect x="40" y="240" width="400" height="148" rx="12" fill="#0b1020"/>
  <text x="62" y="270" font-size="13" fill="#7aa2ff" font-family="ui-monospace, Menlo, monospace">def no_invented_ids(trace):</text>
  <text x="62" y="294" font-size="13" fill="#e6e8ee" font-family="ui-monospace, Menlo, monospace">  valid = ids(trace.input)</text>
  <text x="62" y="318" font-size="13" fill="#e6e8ee" font-family="ui-monospace, Menlo, monospace">  bad = ids(trace.output) - valid</text>
  <text x="62" y="342" font-size="13" fill="#8ee6b6" font-family="ui-monospace, Menlo, monospace">  return not bad, (</text>
  <text x="62" y="366" font-size="13" fill="#ff9bbf" font-family="ui-monospace, Menlo, monospace">    f"invented: {bad}" if bad else "ok")</text>

  <!-- verdict -->
  <rect x="460" y="240" width="260" height="148" rx="12" fill="#fff7e0" stroke="#9a6700" stroke-width="1.5"/>
  <text x="482" y="272" font-size="14" font-weight="700" fill="#b3236a">FAIL</text>
  <text x="482" y="302" font-size="13" fill="#23272f">TCK-2299 not in input —</text>
  <text x="482" y="322" font-size="13" fill="#23272f">a hallucinated ticket ID.</text>
  <text x="482" y="358" font-size="12" fill="#6b7280" font-style="italic">reason: "invented:</text>
  <text x="482" y="376" font-size="12" fill="#6b7280" font-style="italic">{'TCK-2299'}"</text>
</svg>
