<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="100%" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif">
  <defs>
    <marker id="arrow3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3b6cf6"/>
    </marker>
  </defs>

  <text x="380" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#23272f">One workflow, multiple traces</text>
  <text x="380" y="58" text-anchor="middle" font-size="13" fill="#6b7280">AI slide tool (Gamma-style): trace boundaries follow agent tasks, not the user's single flow</text>

  <!-- user-perceived continuous flow band -->
  <rect x="30" y="82" width="700" height="40" rx="10" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="380" y="107" text-anchor="middle" font-size="13" font-style="italic" fill="#1e40af">What the user feels: one continuous deck-building session</text>

  <!-- Trace A -->
  <rect x="40" y="150" width="320" height="240" rx="12" fill="#e7f6ef" stroke="#0f7b54" stroke-width="2"/>
  <text x="200" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#0f7b54">Trace A — slide generation</text>
  <text x="200" y="200" text-anchor="middle" font-size="12" fill="#6b7280">outline → slides, one agent task</text>

  <rect x="62" y="214" width="276" height="44" rx="9" fill="#ffffff" stroke="#0f7b54" stroke-width="1.5"/>
  <text x="200" y="241" text-anchor="middle" font-size="12.5" fill="#23272f">User prompt: "Deck on Q3 results"</text>
  <rect x="62" y="272" width="276" height="44" rx="9" fill="#ffffff" stroke="#0f7b54" stroke-width="1.5"/>
  <text x="200" y="299" text-anchor="middle" font-size="12.5" fill="#23272f">Agent drafts outline</text>
  <rect x="62" y="330" width="276" height="44" rx="9" fill="#ffffff" stroke="#0f7b54" stroke-width="1.5"/>
  <text x="200" y="357" text-anchor="middle" font-size="12.5" fill="#23272f">Agent generates all slides</text>

  <line x1="200" y1="258" x2="200" y2="270" stroke="#0f7b54" stroke-width="2" marker-end="url(#arrow3)"/>
  <line x1="200" y1="316" x2="200" y2="328" stroke="#0f7b54" stroke-width="2" marker-end="url(#arrow3)"/>

  <!-- Trace B group -->
  <rect x="400" y="150" width="320" height="240" rx="12" fill="#fff7e0" stroke="#9a6700" stroke-width="2"/>
  <text x="560" y="178" text-anchor="middle" font-size="15" font-weight="700" fill="#9a6700">Trace group B — slide rewrite</text>
  <text x="560" y="200" text-anchor="middle" font-size="12" fill="#6b7280">iterative edits, separate tasks</text>

  <rect x="422" y="214" width="276" height="44" rx="9" fill="#ffffff" stroke="#9a6700" stroke-width="1.5"/>
  <text x="560" y="241" text-anchor="middle" font-size="12.5" fill="#23272f">"Make slide 3 punchier" → trace B1</text>
  <rect x="422" y="272" width="276" height="44" rx="9" fill="#ffffff" stroke="#9a6700" stroke-width="1.5"/>
  <text x="560" y="299" text-anchor="middle" font-size="12.5" fill="#23272f">"Add a chart here" → trace B2</text>
  <rect x="422" y="330" width="276" height="44" rx="9" fill="#ffffff" stroke="#9a6700" stroke-width="1.5"/>
  <text x="560" y="357" text-anchor="middle" font-size="12.5" fill="#23272f">"Shorten the title" → trace B3</text>

  <!-- boundary divider -->
  <line x1="380" y1="150" x2="380" y2="390" stroke="#3b6cf6" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="380" y="410" text-anchor="middle" font-size="12" font-weight="700" fill="#3b6cf6">trace boundary = agent task boundary</text>
</svg>
