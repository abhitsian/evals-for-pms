<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" width="100%" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif">
  <text x="32" y="38" font-size="18" font-weight="700" fill="#23272f">Standard EAP vs eval-first EAP</text>
  <text x="32" y="60" font-size="13" fill="#6b7280">The 27-point gap was in the dataset, not the model.</text>

  <!-- Standard panel -->
  <rect x="32" y="84" width="336" height="320" rx="12" fill="#fff7e0" stroke="#9a6700" stroke-width="1.5"/>
  <text x="52" y="112" font-size="15" font-weight="700" fill="#9a6700">Standard EAP</text>
  <text x="52" y="132" font-size="12.5" fill="#23272f">Question: "Does it work?"</text>
  <text x="52" y="150" font-size="11.5" fill="#6b7280">friendly participants · clean internal docs</text>

  <!-- big number -->
  <text x="200" y="230" font-size="64" font-weight="700" fill="#9a6700" text-anchor="middle">87%</text>
  <text x="200" y="256" font-size="12.5" fill="#6b7280" text-anchor="middle">pass rate on clean internal docs</text>

  <rect x="52" y="282" width="296" height="104" rx="10" fill="#ffffff" stroke="#9a6700" stroke-width="1.2"/>
  <text x="68" y="306" font-size="12" fill="#23272f">Deliverable: testimonials</text>
  <text x="68" y="328" font-size="11.5" fill="#6b7280">"Five customers said they liked it."</text>
  <text x="68" y="354" font-size="11.5" fill="#6b7280">Hides reality — flattering, not signal.</text>

  <!-- gap arrow / badge in middle -->
  <rect x="338" y="216" width="84" height="48" rx="10" fill="#ffffff" stroke="#23272f" stroke-width="1.8"/>
  <text x="380" y="238" font-size="13" font-weight="700" fill="#23272f" text-anchor="middle">−27 pts</text>
  <text x="380" y="255" font-size="10" fill="#6b7280" text-anchor="middle">the gap</text>

  <!-- Eval-first panel -->
  <rect x="392" y="84" width="336" height="320" rx="12" fill="#e7f6ef" stroke="#0f7b54" stroke-width="1.5"/>
  <text x="412" y="112" font-size="15" font-weight="700" fill="#0f7b54">Eval-first EAP</text>
  <text x="412" y="132" font-size="12.5" fill="#23272f">Question: "Where does it break?"</text>
  <text x="412" y="150" font-size="11.5" fill="#6b7280">max-diversity customers · real data</text>

  <text x="560" y="230" font-size="64" font-weight="700" fill="#0f7b54" text-anchor="middle">60%</text>
  <text x="560" y="256" font-size="12.5" fill="#6b7280" text-anchor="middle">pass rate on real customer data</text>

  <rect x="412" y="282" width="296" height="104" rx="10" fill="#ffffff" stroke="#0f7b54" stroke-width="1.2"/>
  <text x="428" y="306" font-size="12" fill="#23272f">Deliverable: labeled examples</text>
  <text x="428" y="328" font-size="11.5" fill="#6b7280">"12 failure patterns in messy PDFs,</text>
  <text x="428" y="346" font-size="11.5" fill="#6b7280">40 labeled examples added."</text>
  <text x="428" y="370" font-size="11.5" font-weight="700" fill="#0f7b54">A dataset, not a testimonial.</text>
</svg>
