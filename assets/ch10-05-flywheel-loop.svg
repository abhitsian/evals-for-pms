<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="100%" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Inter, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3b6cf6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="470" fill="#ffffff"/>
  <text x="32" y="40" font-size="18" font-weight="700" fill="#23272f">The flywheel: online monitoring is what spins it</text>
  <text x="32" y="62" font-size="13" fill="#6b7280">Without the feedback-to-dataset step the loop is open — the agent stops learning from reality.</text>

  <!-- center hub -->
  <circle cx="380" cy="270" r="62" fill="#eaf0ff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="380" y="262" font-size="14" font-weight="700" fill="#1e40af" text-anchor="middle">AI Product</text>
  <text x="380" y="282" font-size="14" font-weight="700" fill="#1e40af" text-anchor="middle">Flywheel</text>

  <!-- 4 nodes around the circle -->
  <!-- top: production experience -->
  <rect x="298" y="92" width="164" height="62" rx="11" fill="#ffffff" stroke="#0f7b54" stroke-width="1.5"/>
  <text x="380" y="120" font-size="13.5" font-weight="700" fill="#0f7b54" text-anchor="middle">Production</text>
  <text x="380" y="139" font-size="13.5" font-weight="700" fill="#0f7b54" text-anchor="middle">experience</text>

  <!-- right: labeled data -->
  <rect x="566" y="240" width="164" height="62" rx="11" fill="#ffffff" stroke="#9a6700" stroke-width="1.5"/>
  <text x="648" y="268" font-size="13.5" font-weight="700" fill="#9a6700" text-anchor="middle">Labeled data</text>
  <text x="648" y="287" font-size="12" fill="#6b7280" text-anchor="middle">tickets · edits · flags</text>

  <!-- bottom: better evals -->
  <rect x="298" y="388" width="164" height="62" rx="11" fill="#ffffff" stroke="#3b6cf6" stroke-width="1.5"/>
  <text x="380" y="416" font-size="13.5" font-weight="700" fill="#1e40af" text-anchor="middle">Better evals</text>
  <text x="380" y="435" font-size="12" fill="#6b7280" text-anchor="middle">+ richer dataset</text>

  <!-- left: better improvements -->
  <rect x="30" y="240" width="164" height="62" rx="11" fill="#ffffff" stroke="#0f7b54" stroke-width="1.5"/>
  <text x="112" y="268" font-size="13.5" font-weight="700" fill="#0f7b54" text-anchor="middle">Better</text>
  <text x="112" y="287" font-size="13.5" font-weight="700" fill="#0f7b54" text-anchor="middle">improvements</text>

  <!-- curved arrows clockwise -->
  <path d="M462,128 C540,150 590,190 612,236" fill="none" stroke="#3b6cf6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M640,302 C620,360 560,402 466,418" fill="none" stroke="#3b6cf6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M294,420 C200,404 138,360 118,304" fill="none" stroke="#3b6cf6" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M120,238 C146,190 198,150 296,128" fill="none" stroke="#3b6cf6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- arrow labels -->
  <text x="556" y="172" font-size="11.5" fill="#6b7280" text-anchor="middle">monitoring</text>
  <text x="556" y="186" font-size="11.5" fill="#6b7280" text-anchor="middle">captures it</text>
  <text x="206" y="172" font-size="11.5" fill="#6b7280" text-anchor="middle">ship the</text>
  <text x="206" y="186" font-size="11.5" fill="#6b7280" text-anchor="middle">better agent</text>
</svg>
